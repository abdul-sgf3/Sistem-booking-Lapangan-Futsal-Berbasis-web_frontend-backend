$kind: collection
description: Koleksi pengujian endpoint aktual PHP Vincent SQ Arena. Tiap request memeriksa HTTP status, Content-Type, struktur JSON, dan assertion sesuai skenario. Jalankan berurutan melalui Collection Runner. Login admin memerlukan kredensial valid pada Environment.
