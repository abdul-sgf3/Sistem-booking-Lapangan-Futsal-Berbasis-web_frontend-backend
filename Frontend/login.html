<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --vsq-navy:#131B2E; --vsq-blue:#477FEB; --vsq-red:#FF0000; --vsq-gray:#848484; --vsq-error:#F04B4B; --vsq-bg:#F5F6FA; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { min-height:100%; }
        body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--vsq-bg); overflow-x:hidden; }
        .vsq-login-wrapper { display:flex; min-height:100vh; width:100%; }
        .vsq-login-left { flex:0 0 63.33%; background:var(--vsq-bg); display:flex; align-items:center; justify-content:center; padding:32px 24px; position:relative; }
        .vsq-back-btn { position:absolute; top:50px; left:52px; display:flex; align-items:center; justify-content:center; transition:transform .2s; }
        .vsq-back-btn:hover { transform:translateX(-4px); }
        .vsq-back-btn svg { width:54px; height:52px; stroke:var(--vsq-navy); stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
        .vsq-login-card { width:100%; max-width:515px; }
        .vsq-logo { margin-bottom:49px; text-align:center; }
        .vsq-logo img { display:block; width:275px; height:auto; margin:0 auto; }
        .vsq-logo-text { display:none; }
        .vsq-logo-text h1 { font-size:38px; font-weight:800; color:var(--vsq-navy); letter-spacing:-.5px; line-height:1.2; }
        .vsq-logo-text p { font-size:22px; font-weight:800; color:var(--vsq-red); letter-spacing:.6px; text-transform:uppercase; margin-top:4px; line-height:1.1; }
        .vsq-logo.logo-fallback img { display:none; }
        .vsq-logo.logo-fallback .vsq-logo-text { display:block; }
        .vsq-welcome { text-align:center; font-size:20px; font-weight:600; line-height:26px; color:#111827; margin-bottom:54px; }

        .vsq-form-group { position:relative; margin-bottom:49px; }
        .vsq-form-group.no-gap { margin-bottom:0; }
        .vsq-form-group label { display:block; font-size:16px; font-weight:500; line-height:19px; color:#111827; margin-bottom:10px; }
        .vsq-input-wrapper { position:relative; width:100%; }
        .vsq-form-control { width:100%; height:55px; padding:0 56px 0 30px; font-size:16px; font-weight:400; font-family:'Plus Jakarta Sans',sans-serif; color:#111827; background:#fff; border:1px solid var(--vsq-gray); border-radius:14px; outline:none; transition:border-color .2s ease; }
        .vsq-form-control::placeholder { color:#8E8E93; }
        .vsq-form-control:focus { border-color:var(--vsq-navy); }
        .vsq-form-control.is-invalid { border-color:var(--vsq-error) !important; }
        .vsq-form-control:-webkit-autofill, .vsq-form-control:-webkit-autofill:hover, .vsq-form-control:-webkit-autofill:focus, .vsq-form-control:-webkit-autofill:active { -webkit-box-shadow:0 0 0 60px #fff inset !important; box-shadow:0 0 0 60px #fff inset !important; transition:background-color 5000s ease-in-out 0s; }

        .vsq-error-msg { display:none; align-items:center; gap:8px; font-size:13px; font-weight:500; line-height:16px; color:var(--vsq-error); }
        .vsq-error-msg.show { display:flex; }
        .vsq-error-msg.abs { position:absolute; left:0; top:calc(100% + 9px); }
        .vsq-error-icon { width:14px; height:14px; border:1.5px solid var(--vsq-error); color:var(--vsq-error); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; line-height:1; flex-shrink:0; }
        .vsq-error-subtext { display:none; font-size:12px; line-height:16px; color:#6B7280; margin-top:6px; padding-left:22px; }
        .vsq-error-subtext.show { display:block; }

        .vsq-toggle-password { position:absolute; right:28px; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--vsq-navy); background:transparent; border:none; display:flex; align-items:center; justify-content:center; z-index:2; }
        .vsq-form-control:placeholder-shown ~ .vsq-toggle-password { color:#8E8E93; }
        .vsq-toggle-password svg { width:30px; height:30px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }

        .vsq-auth-row { display:flex; justify-content:space-between; align-items:flex-start; height:68px; padding-top:8px; }
        .vsq-auth-errors { flex:1; min-width:0; }
        .vsq-forgot-link { margin-top:4px; padding-right:5px; flex-shrink:0; }
        .vsq-forgot-link a { font-size:13px; line-height:16px; color:var(--vsq-blue); text-decoration:none; font-weight:500; }
        .vsq-forgot-link a:hover { text-decoration:underline; }

        .vsq-captcha-group { position:relative; margin-bottom:35px; }
        .vsq-recaptcha { background:#fff; border:1px solid #9B9B9B; height:99px; padding:0 48px 0 37px; display:flex; align-items:center; justify-content:space-between; transition:border-color .2s; }
        .vsq-recaptcha.is-invalid { border-color:var(--vsq-error); }
        .vsq-recaptcha.is-invalid .vsq-recaptcha-checkbox { border-color:var(--vsq-error); }
        .vsq-recaptcha-left { display:flex; align-items:center; gap:31px; }
        .vsq-recaptcha-checkbox { width:33px; height:33px; border:1px solid #8F8F8F; border-radius:2px; background:#fff; cursor:pointer; appearance:none; -webkit-appearance:none; transition:border-color .2s; position:relative; flex-shrink:0; }
        .vsq-recaptcha-label { font-size:17px; color:#111827; cursor:pointer; font-weight:400; }
        .vsq-recaptcha-logo { width:54px; display:flex; align-items:center; justify-content:center; }
        .vsq-recaptcha-logo img { width:100%; height:auto; object-fit:contain; }
        .vsq-recaptcha-spinner { width:30px; height:30px; margin:1.5px; border:3px solid #E5E7EB; border-top-color:var(--vsq-blue); border-radius:50%; animation:vsq-spin .8s linear infinite; display:none; flex-shrink:0; }
        @keyframes vsq-spin { to { transform:rotate(360deg); } }
        .vsq-recaptcha.is-loading .vsq-recaptcha-checkbox, .vsq-recaptcha.is-verified .vsq-recaptcha-checkbox { display:none; }
        .vsq-recaptcha.is-loading .vsq-recaptcha-spinner { display:block; }
        .vsq-recaptcha-check-icon { width:33px; height:33px; display:none; align-items:center; justify-content:center; flex-shrink:0; }
        .vsq-recaptcha.is-verified .vsq-recaptcha-check-icon { display:flex; }
        .vsq-recaptcha-check-icon svg { width:100%; height:100%; stroke:var(--vsq-blue); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
        @keyframes vsq-check-pop { 0% { transform:scale(0); opacity:0; } 50% { transform:scale(1.2); } 100% { transform:scale(1); opacity:1; } }
        .vsq-recaptcha.is-verified .vsq-recaptcha-check-icon svg { animation:vsq-check-pop .35s ease-out; }

        .vsq-register-link { text-align:center; font-size:15px; line-height:20px; color:#111827; margin-bottom:40px; font-weight:500; }
        .vsq-register-link a { font-size:13px; color:var(--vsq-blue); text-decoration:none; font-weight:500; margin-left:8px; }
        .vsq-register-link a:hover { text-decoration:underline; }

        .vsq-btn-submit { display:flex; justify-content:center; align-items:center; width:100%; height:53px; padding:0 20px; font-size:17px; font-weight:600; font-family:'Plus Jakarta Sans',sans-serif; color:#fff; background-color:var(--vsq-navy); border:none; border-radius:16px; cursor:pointer; transition:background-color .3s ease; }
        .vsq-btn-submit:hover { background-color:#0a0e1a; }
        .vsq-btn-submit:disabled { opacity:.6; cursor:not-allowed; }

        .vsq-login-right { flex:1; background:linear-gradient(rgba(19,27,46,.6),rgba(19,27,46,.6)),url('assets/uploads/lapangan/Lapangan2.jpeg') center/cover no-repeat; }

        .network-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background-color:#1A2235; z-index:99999; display:flex; align-items:center; justify-content:center; transition:opacity .3s ease; }
        .network-content { text-align:center; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .network-icon svg { width:120px; height:120px; stroke:#FF3B30; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; margin-bottom:30px; }
        .network-title { color:#fff; font-size:32px; font-weight:700; margin-bottom:12px; letter-spacing:-.5px; }
        .network-message { color:#A0ABC0; font-size:18px; margin-bottom:30px; font-weight:500; }
        .network-btn { background-color:#FF3B30; color:#fff; border:none; padding:14px 40px; font-size:16px; font-weight:600; border-radius:12px; cursor:pointer; transition:background .2s ease, transform .2s ease; font-family:'Plus Jakarta Sans',sans-serif; }
        .network-btn:hover { background-color:#E03127; transform:translateY(-2px); }

        @media (min-width:901px) and (max-height:860px) { .vsq-login-card { zoom:.9; } }
        @media (min-width:901px) and (max-height:760px) { .vsq-login-card { zoom:.8; } }
        @media (min-width:901px) and (max-width:1200px) { .vsq-back-btn { top:36px; left:36px; } .vsq-back-btn svg { width:40px; height:38px; } }
        @media (max-width:900px) {
            .vsq-login-wrapper { flex-direction:column; }
            .vsq-login-left { flex:none; width:100%; padding:80px 20px 40px; }
            .vsq-login-right { min-height:200px; order:-1; }
            .vsq-back-btn { top:20px; left:20px; }
            .vsq-back-btn svg { width:36px; height:34px; }
            .vsq-logo { margin-bottom:32px; }
            .vsq-logo img { width:220px; }
            .vsq-welcome { margin-bottom:36px; }
            .network-icon svg { width:80px; height:80px; margin-bottom:20px; }
            .network-title { font-size:24px; }
            .network-message { font-size:15px; }
            .network-btn { padding:12px 32px; font-size:14px; }
        }
    </style>
</head>
<body>
    <div class="vsq-login-wrapper">
        <div class="vsq-login-left">
            <a href="index.html" class="vsq-back-btn" title="Kembali ke Beranda" aria-label="Kembali ke Beranda">
                <svg viewBox="0 0 54 52"><path d="M52 26H2M26 2L2 26l24 24"/></svg>
            </a>

            <div class="vsq-login-card">
                <div class="vsq-logo">
                    <img src="assets/images/logo.png" alt="Vincent'SQ Sports Arena" onerror="this.parentNode.classList.add('logo-fallback')">
                    <div class="vsq-logo-text"><h1>Vincent'SQ</h1><p>SPORTS ARENA</p></div>
                </div>

                <div class="vsq-welcome">Selamat Datang kembali!</div>

                <form id="login-form" novalidate>
                    <div class="vsq-form-group">
                        <label for="email">Email*</label>
                        <div class="vsq-input-wrapper">
                            <input type="text" inputmode="email" autocomplete="email" id="email" name="email" class="vsq-form-control" placeholder="Masukkan email...">
                            <div class="vsq-error-msg abs" id="err-email"><span class="vsq-error-icon">!</span><span class="vsq-error-text"></span></div>
                        </div>
                    </div>

                    <div class="vsq-form-group no-gap">
                        <label for="password">Password*</label>
                        <div class="vsq-input-wrapper">
                            <input type="password" id="password" name="password" autocomplete="current-password" class="vsq-form-control" placeholder="Masukkan Password...">
                            <button type="button" class="vsq-toggle-password" aria-label="Tampilkan / sembunyikan password" onclick="togglePassword('password', this)">
                                <svg viewBox="0 0 24 24" class="icon-eye-closed"><path d="M3 10 Q12 18 21 10"/><line x1="3" y1="10" x2="2" y2="13"/><line x1="7" y1="13" x2="5.5" y2="16"/><line x1="12" y1="15" x2="12" y2="18"/><line x1="17" y1="13" x2="18.5" y2="16"/><line x1="21" y1="10" x2="22" y2="13"/></svg>
                                <svg viewBox="0 0 24 24" class="icon-eye-open" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="vsq-auth-row">
                        <div class="vsq-auth-errors">
                            <div class="vsq-error-msg" id="err-password"><span class="vsq-error-icon">!</span><span class="vsq-error-text"></span></div>
                            <div class="vsq-error-msg" id="err-auth"><span class="vsq-error-icon">!</span><span class="vsq-error-text"></span></div>
                            <div class="vsq-error-subtext" id="err-auth-sub"></div>
                        </div>
                        <div class="vsq-forgot-link"><a href="lupa_password.html">Lupa Password?</a></div>
                    </div>

                    <div class="vsq-captcha-group">
                        <div class="vsq-recaptcha" id="recaptcha-wrapper">
                            <div class="vsq-recaptcha-left">
                                <input type="checkbox" id="recaptcha" class="vsq-recaptcha-checkbox">
                                <div class="vsq-recaptcha-spinner"></div>
                                <div class="vsq-recaptcha-check-icon"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></div>
                                <label for="recaptcha" class="vsq-recaptcha-label">I'm not a robot</label>
                            </div>
                            <div class="vsq-recaptcha-logo"><img src="assets/images/recaptcha.png" alt="reCAPTCHA"></div>
                        </div>
                        <div class="vsq-error-msg abs" id="err-captcha"><span class="vsq-error-icon">!</span><span class="vsq-error-text"></span></div>
                    </div>

                    <div class="vsq-register-link">Belum mempunyai akun? <a href="register.html">Daftar sekarang</a></div>
                    <button type="submit" class="vsq-btn-submit" id="btn-submit">Masuk</button>
                </form>
            </div>
        </div>
        <div class="vsq-login-right"></div>
    </div>

    <div id="network-overlay" class="network-overlay" style="display:none; opacity:0;">
        <div class="network-content">
            <div class="network-icon">
                <svg viewBox="0 0 24 24"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
            </div>
            <h2 class="network-title">Tidak Ada Koneksi Internet</h2>
            <p class="network-message">Periksa Koneksi Anda Kembali</p>
            <button onclick="retryConnection()" class="network-btn">Coba Lagi</button>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        // ===== NETWORK OVERLAY =====
        function showNetworkOverlay() {
            const o = document.getElementById('network-overlay');
            o.style.display = 'flex'; void o.offsetWidth; o.style.opacity = '1';
        }
        function hideNetworkOverlay() {
            const o = document.getElementById('network-overlay');
            o.style.opacity = '0';
            setTimeout(() => { o.style.display = 'none'; }, 300);
        }
        window.addEventListener('offline', showNetworkOverlay);
        window.addEventListener('online', hideNetworkOverlay);
        window.addEventListener('load', () => { if (!navigator.onLine) showNetworkOverlay(); });
        function retryConnection() { if (navigator.onLine) hideNetworkOverlay(); else showNetworkOverlay(); }

        // ===== TOGGLE PASSWORD =====
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const closed = btn.querySelector('.icon-eye-closed');
            const open = btn.querySelector('.icon-eye-open');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            closed.style.display = show ? 'none' : 'block';
            open.style.display = show ? 'block' : 'none';
        }

        // ===== PESAN =====
        const MSG = {
            emailKosong:   'Email tidak boleh kosong',
            emailSpasi:    'Email tidak boleh menggunakan spasi!',
            emailFormat:   'Email harus mengandung karakter @ dan .',
            emailNotFound: 'Email belum terdaftar!',
            passKosong:    'Password tidak boleh kosong!',
            authSalah:     'Email atau Password salah!',
            authSub:       'Periksa kembali data login Anda atau gunakan fitur Lupa Password.',
            captcha:       'Harap centang Captcha terlebih dahulu!'
        };
        const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // ===== ELEMEN =====
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const captchaInput = document.getElementById('recaptcha');
        const recaptchaWrapper = document.getElementById('recaptcha-wrapper');
        const btnSubmit = document.getElementById('btn-submit');
        const errEmail = document.getElementById('err-email');
        const errPassword = document.getElementById('err-password');
        const errAuth = document.getElementById('err-auth');
        const errAuthSub = document.getElementById('err-auth-sub');
        const errCaptcha = document.getElementById('err-captcha');

        function showError(el, message) { el.querySelector('.vsq-error-text').textContent = message; el.classList.add('show'); }
        function hideError(el) { el.classList.remove('show'); }
        function showAuthError(msg, sub) {
            showError(errAuth, msg || MSG.authSalah);
            errAuthSub.textContent = sub || MSG.authSub;
            errAuthSub.classList.add('show');
        }
        function clearAuthError() { hideError(errAuth); errAuthSub.classList.remove('show'); }

        // ===== VALIDASI =====
        function validateEmail() {
            const val = emailInput.value;
            let msg = '';
            if (val.trim() === '') msg = MSG.emailKosong;
            else if (/\s/.test(val)) msg = MSG.emailSpasi;
            else if (!EMAIL_REGEX.test(val)) msg = MSG.emailFormat;
            if (msg) { emailInput.classList.add('is-invalid'); showError(errEmail, msg); return false; }
            emailInput.classList.remove('is-invalid'); hideError(errEmail);
            return true;
        }
        function validatePassword() {
            if (passwordInput.value.trim() === '') {
                passwordInput.classList.add('is-invalid'); showError(errPassword, MSG.passKosong); return false;
            }
            passwordInput.classList.remove('is-invalid'); hideError(errPassword);
            return true;
        }

        emailInput.addEventListener('input', () => { clearAuthError(); validateEmail(); });
        passwordInput.addEventListener('input', () => { clearAuthError(); validatePassword(); });
        emailInput.addEventListener('blur', () => { if (emailInput.value.trim() === '') validateEmail(); });
        passwordInput.addEventListener('blur', () => { if (passwordInput.value.trim() === '') validatePassword(); });

        // ===== CAPTCHA (tampilan saja; BE belum memverifikasi) =====
        let captchaVerified = false;
        captchaInput.addEventListener('change', function () {
            if (this.checked) {
                captchaVerified = false;
                recaptchaWrapper.classList.add('is-loading');
                recaptchaWrapper.classList.remove('is-verified');
                setTimeout(() => {
                    recaptchaWrapper.classList.remove('is-loading');
                    recaptchaWrapper.classList.add('is-verified');
                    captchaVerified = true;
                    recaptchaWrapper.classList.remove('is-invalid');
                    hideError(errCaptcha);
                }, 1200);
            } else {
                captchaVerified = false;
                recaptchaWrapper.classList.remove('is-loading', 'is-verified');
            }
        });

        // ===== SUBMIT =====
        let isSubmitting = false;
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            if (isSubmitting) return;

            const okEmail = validateEmail();
            const okPass = validatePassword();
            if (!okEmail || !okPass) return;

            if (!captchaVerified) {
                if (!captchaInput.checked) {
                    recaptchaWrapper.classList.add('is-invalid');
                    showError(errCaptcha, MSG.captcha);
                }
                return; // sedang loading: tunggu selesai
            }

            clearAuthError();
            isSubmitting = true;
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Memproses...';

            const r = await apiPost('/auth/login.php', {
                email: emailInput.value.trim().toLowerCase(),
                password: passwordInput.value
            });

            if (r.networkError) {
                showNetworkOverlay();
            } else if (r.ok) {
                const u = r.data;
                localStorage.setItem('vsq_user', JSON.stringify(u));
                localStorage.setItem('user_id', u.user_id);
                localStorage.setItem('nama', u.nama || 'User');
                localStorage.setItem('user_email', u.email || '');

                let redirectUrl = u.redirect || 'index.html';
                if (u.role === 'admin') {
                    redirectUrl = 'admin/dashboard.html';
                } else if (!u.need_profile) {
                    const saved = sessionStorage.getItem('vsq_redirect');
                    if (saved) { sessionStorage.removeItem('vsq_redirect'); redirectUrl = saved; }
                }
                window.location.href = redirectUrl;
                return;
            } else if (r.status === 403 && r.data.need_verify) {
                // Email belum diverifikasi: BE sudah kirim OTP & menyimpan session register
                localStorage.setItem('register_email', r.data.email || emailInput.value.trim());
                window.location.href = r.data.redirect || 'verifikasi.html';
                return;
            } else if (r.status === 401 && /email tidak terdaftar/i.test(r.message)) {
                emailInput.classList.add('is-invalid');
                showError(errEmail, MSG.emailNotFound);
            } else if (r.status === 401) {
                showAuthError();
            } else {
                showAuthError(r.message || 'Terjadi kesalahan saat login.', ' ');
            }

            isSubmitting = false;
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Masuk';
        });
    </script>
</body>
</html>
