$kind: http-request
url: "{{baseUrl}}/admin/statistik.php"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP status = 200', function () { pm.response.to.have.status(200); });
      pm.test('Response header Content-Type JSON', function () { pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'); });
      let j = {}; try { j = pm.response.json(); } catch(e) { pm.expect.fail('Response bukan JSON valid: ' + e.message); }
      pm.test('Response memiliki struktur JSON standar', function () { pm.expect(j).to.be.an('object'); pm.expect(j).to.have.property('status'); pm.expect(j).to.have.property('message'); });
      pm.test('Status response success', function () { pm.expect(j.status).to.eql('success'); pm.expect(j).to.have.property('data'); });
      pm.test('Statistik memiliki total booking',()=>pm.expect(j.data).to.have.property('total_booking'));
    language: text/javascript
order: 5000
