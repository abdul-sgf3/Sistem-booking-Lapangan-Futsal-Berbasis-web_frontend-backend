$kind: http-example
name: "15 - Login Berhasil: Email Huruf Besar & Spasi (Case-Insensitive)"
request:
  url: "{{base_url}}/{{backend_path}}/auth/login.php"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "  {{login_email_upper}}  ",
        "password": "{{login_password}}"
      }
