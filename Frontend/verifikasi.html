<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Email - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --vsq-navy: #131B2E; --vsq-red: #FF0000; 
            --vsq-gray: #848484; --vsq-error: #FF5555;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; 
            background: linear-gradient(rgba(19, 27, 46, 0.7), rgba(19, 27, 46, 0.7)), url('assets/uploads/lapangan/hero.jpeg') center/cover no-repeat fixed;
            display: flex; align-items: center; justify-content: center; padding: 20px; 
        }

        .vsq-back-btn { position: absolute; top: 40px; left: 40px; color: #FFFFFF; text-decoration: none; z-index: 10; transition: transform 0.2s; }
        .vsq-back-btn:hover { transform: translateX(-4px); }
        .vsq-back-btn svg { width: 36px; height: 36px; stroke: #FFFFFF; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .vsq-verify-card { 
            background: #FFFFFF; width: 100%; max-width: 420px; border-radius: 20px; padding: 40px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.3); text-align: center; display: flex; flex-direction: column; align-items: center; position: relative;
        }

        .vsq-logo { margin-bottom: 24px; }
        .vsq-logo h1 { font-size: 32px; font-weight: 800; color: var(--vsq-navy); margin: 0; letter-spacing: -0.5px; }
        .vsq-logo p { font-size: 18px; font-weight: 800; color: var(--vsq-red); letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }

        .vsq-illustration { width: 160px; height: auto; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
        .vsq-illustration img { width: 100%; height: auto; object-fit: contain; }

        .vsq-text { font-size: 14px; color: #000000; line-height: 1.5; margin-bottom: 24px; }
        .vsq-text strong { color: #000000; font-weight: 700; display: block; margin-top: 4px; font-size: 15px; }

        .vsq-otp-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; width: 100%; }
        .vsq-otp-input { 
            width: 48px; height: 56px; text-align: center; font-size: 24px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif;
            border: 1px solid var(--vsq-gray); border-radius: 10px; outline: none; background: #FFFFFF; transition: all 0.2s; color: #000000;
        }
        .vsq-otp-input:focus { border-color: var(--vsq-navy); box-shadow: 0 0 0 3px rgba(19, 27, 46, 0.1); }
        .vsq-otp-input.is-invalid { border: 1.5px solid var(--vsq-error) !important; }
        
        .vsq-error-msg { display: none; color: var(--vsq-error); font-size: 12px; font-weight: 500; margin-bottom: 16px; align-items: center; justify-content: center; gap: 6px; }
        .vsq-error-msg.show { display: flex; }
        .vsq-error-icon { width: 14px; height: 14px; background: transparent; border: 2px solid var(--vsq-error); color: var(--vsq-error); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; flex-shrink: 0; }

        .vsq-timer-text { font-size: 13px; color: #4B5563; margin-bottom: 8px; }
        .vsq-timer-text span { color: #477FEB; font-weight: 500; }
        
        .vsq-change-email { font-size: 13px; color: #4B5563; margin-bottom: 24px; }
        .vsq-change-email a { color: #477FEB; text-decoration: none; font-weight: 500; }
        .vsq-change-email a:hover { text-decoration: underline; }

        .vsq-btn { background: var(--vsq-navy); color: #FFFFFF; border: none; width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; transition: background 0.2s; }
        .vsq-btn:hover { background-color: #0a0e1a; }
        .vsq-btn:disabled { background-color: #93C5FD; cursor: not-allowed; }
    </style>
</head>
<body>

    <a href="register.html" class="vsq-back-btn">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>

    <div class="vsq-verify-card">
        <div class="vsq-logo"><h1>Vincent'SQ</h1><p>SPORTS ARENA</p></div>

        <div class="vsq-illustration">
            <img src="assets/images/ilustrasi-kurir.png" alt="Ilustrasi Kurir">
        </div>

        <div class="vsq-text">Kami telah mengirimkan kode verifikasi ke <strong id="email-target">email@anda.com</strong></div>

        <form id="otpForm" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            
            <div class="vsq-otp-container">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 1)" autofocus inputmode="numeric">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 2)" inputmode="numeric">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 3)" inputmode="numeric">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 4)" inputmode="numeric">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 5)" inputmode="numeric">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 6)" inputmode="numeric">
            </div>

            <div class="vsq-error-msg" id="err-otp">
                <span class="vsq-error-icon">!</span>
                <span id="err-otp-text">Kode OTP belum dimasukan!</span>
            </div>

            <div class="vsq-timer-text">Kirim ulang kode dalam <span id="timer">01:00</span></div>
            <div class="vsq-change-email">Salah Email? <a href="register.html">Ganti email</a></div>

            <button type="submit" class="vsq-btn" id="btnVerifikasi">Verifikasi</button>
        </form>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost/vincent-arena/Backend/API' 
            : 'https://sistem-booking-lapangan-futsal-berbasis-webfron-production.up.railway.app/API';
        
        const savedEmail = localStorage.getItem('register_email');
        if(savedEmail) { document.getElementById('email-target').textContent = savedEmail; } 
        else { window.location.href = 'register.html'; }

        function moveFocus(current, nextIndex) {
            current.value = current.value.replace(/[^0-9]/g, ''); 
            if (current.value.length === 1) {
                const inputs = document.querySelectorAll('.vsq-otp-input');
                if (nextIndex < inputs.length) inputs[nextIndex].focus();
            }
            resetErrorState();
        }

        document.querySelectorAll('.vsq-otp-input').forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    document.querySelectorAll('.vsq-otp-input')[index - 1].focus();
                }
            });
        });

        function resetErrorState() {
            document.getElementById('err-otp').classList.remove('show');
            document.querySelectorAll('.vsq-otp-input').forEach(el => el.classList.remove('is-invalid'));
        }

        let timeLeft = 60; 
        const timerEl = document.getElementById('timer');
        const countdown = setInterval(() => {
            if (timeLeft <= 0) { 
                clearInterval(countdown); 
                timerEl.textContent = "00:00"; 
                timerEl.style.color = "#FF5555";
                return; 
            }
            timeLeft--;
            timerEl.textContent = `0${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`;
        }, 1000);

        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const inputs = document.querySelectorAll('.vsq-otp-input');
            let code6Digit = '';
            inputs.forEach(input => code6Digit += input.value);
            
            const errOtp = document.getElementById('err-otp');
            const errOtpText = document.getElementById('err-otp-text');

            if (code6Digit.length < 6) {
                inputs.forEach(input => { if(input.value === '') input.classList.add('is-invalid'); });
                errOtpText.textContent = "Kode OTP belum dimasukan!";
                errOtp.classList.add('show');
                return;
            }

            const btn = document.getElementById('btnVerifikasi');
            btn.disabled = true; 
            btn.textContent = 'Memverifikasi...';

            try {
                const response = await fetch(API_BASE + '/auth/verify_otp.php', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    credentials: 'include', // <-- PASTIKAN INI ADA
                    body: JSON.stringify({ email: savedEmail, otp: code6Digit })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    window.location.href = 'profil_user.html';
                } else {
                    inputs.forEach(input => input.classList.add('is-invalid'));
                    errOtpText.textContent = result.message;
                    errOtp.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Verifikasi';
                }
            } catch (error) {
                alert('Gagal Terhubung: ' + error.message); 
                btn.disabled = false;
                btn.textContent = 'Verifikasi';
            }
        });
    </script>
</body>
</html>
