<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Email - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS DASAR */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; 
            background: linear-gradient(rgba(19, 27, 46, 0.7), rgba(19, 27, 46, 0.7)), 
                        url('assets/uploads/lapangan/hero.jpeg') center/cover no-repeat fixed;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        /* Tombol Kembali */
        .vsq-back-btn { position: absolute; top: 40px; left: 40px; color: #FFFFFF; text-decoration: none; z-index: 10; }
        .vsq-back-btn svg { width: 32px; height: 32px; stroke: #FFFFFF; stroke-width: 2.5; fill: none; }

        /* Card Putih */
        .vsq-verify-card { 
            background: #FFFFFF; 
            width: 100%; 
            max-width: 400px; 
            border-radius: 15px; 
            padding: 35px 30px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.2); 
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo */
        .vsq-logo { margin-bottom: 15px; }
        .vsq-logo h1 { font-size: 24px; font-weight: 800; color: #131B2E; margin: 0; letter-spacing: -0.5px; }
        .vsq-logo p { font-size: 13px; font-weight: 800; color: #FF0000; letter-spacing: 1px; margin-top: 2px; }

        /* Kotak Gambar Ilustrasi */
        .vsq-illustration { 
            width: 140px; 
            height: 140px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 15px;
        }
        .vsq-illustration img { width: 100%; height: 100%; object-fit: contain; }

        /* Teks Verifikasi */
        .vsq-text { font-size: 12px; color: #333; line-height: 1.5; margin-bottom: 15px; }
        .vsq-text strong { color: #131B2E; font-weight: 700; display: block; margin-top: 2px; font-size: 13px; }

        /* Kotak OTP (6 Digit) */
        .vsq-otp-container { 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
            margin-bottom: 12px; 
            width: 100%;
        }
        .vsq-otp-input { 
            width: 45px; 
            height: 55px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: 600; 
            color: #333; 
            border: 1px solid #CBD5E1; 
            border-radius: 8px; 
            outline: none; 
            background: #FFFFFF;
        }
        .vsq-otp-input:focus { border-color: #477FEB; }
        
        /* Pesan Error OTP */
        .vsq-error-msg {
            display: none;
            color: #FF5555;
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 10px;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .vsq-error-msg.show { display: flex; }

        /* Timer & Ganti Email */
        .vsq-timer-text { font-size: 11px; color: #4B5563; margin-bottom: 4px; }
        .vsq-timer-text span { color: #477FEB; font-weight: 600; }
        
        .vsq-change-email { font-size: 11px; color: #000; margin-bottom: 20px; }
        .vsq-change-email a { color: #477FEB; text-decoration: none; font-weight: 500; }

        /* Tombol Verifikasi */
        .vsq-btn { 
            background: #131B2E; 
            color: #FFFFFF; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        .vsq-btn:hover { background: #1E293B; }
        .vsq-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>

    <a href="register.html" class="vsq-back-btn">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>

    <div class="vsq-verify-card">
        
        <div class="vsq-logo">
            <h1>Vincent'SQ</h1>
            <p>SPORTS ARENA</p>
        </div>

        <div class="vsq-illustration">
            <img src="assets/images/ilustrasi-kurir.png" alt="Ilustrasi Kurir">
        </div>

        <div class="vsq-text">
            Kami telah mengirimkan kode verifikasi ke
            <strong id="email-target">email@anda.com</strong>
        </div>

        <form id="otpForm" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <div class="vsq-otp-container">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 1)" autofocus>
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 2)">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 3)">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 4)">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 5)">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 6)">
            </div>

            <div class="vsq-error-msg" id="err-otp">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="err-otp-text">Kode OTP belum dimasukan!</span>
            </div>

            <div class="vsq-timer-text">Kirim ulang kode dalam <span id="timer">01:00</span></div>
            <div class="vsq-change-email">Salah Email? <a href="register.html">Ganti email</a></div>

            <button type="submit" class="vsq-btn" id="btnVerifikasi">Verifikasi</button>
        </form>

    </div>

    <script>
        // URL Backend (Otomatis mendeteksi localhost atau hosting)
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost/vincent-arena/Backend/API'
            : 'https://URL-RAILWAY-BE-ANDA.up.railway.app'; // Ganti nanti jika sudah deploy

        // 1. Tampilkan Email dari halaman Register
        const savedEmail = localStorage.getItem('register_email');
        if(savedEmail) {
            document.getElementById('email-target').textContent = savedEmail;
        } else {
            window.location.href = 'register.html';
        }

        // 2. Auto-focus antar kotak OTP
        function moveFocus(current, nextIndex) {
            if (current.value.length === 1) {
                const inputs = document.querySelectorAll('.vsq-otp-input');
                if (nextIndex < inputs.length) {
                    inputs[nextIndex].focus();
                }
            }
        }
        
        // Sembunyikan error saat user mulai mengetik
        document.querySelectorAll('.vsq-otp-input').forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('err-otp').classList.remove('show');
            });
        });

        // 3. Timer Hitung Mundur
        let timeLeft = 60; 
        const timerEl = document.getElementById('timer');
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerEl.textContent = "00:00";
                return;
            }
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }, 1000);

        // 4. Proses Submit ke Backend
        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const inputs = document.querySelectorAll('.vsq-otp-input');
            let code = '';
            inputs.forEach(input => code += input.value);
            
            // Validasi 6 digit
            if (code.length < 6) {
                document.getElementById('err-otp-text').textContent = "Kode OTP belum lengkap (harus 6 digit)!";
                document.getElementById('err-otp').classList.add('show');
                return;
            }

            const btn = document.getElementById('btnVerifikasi');
            btn.disabled = true;
            btn.textContent = 'Memverifikasi...';

            try {
                // Tembak API POST
                const response = await fetch(API_BASE + '/auth/verify_otp.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', 
                    body: JSON.stringify({ 
                        email: savedEmail, 
                        otp: code 
                    })
                });
                
                // AMBIL TEKS MENTAH (Untuk melihat jika server error)
                const rawText = await response.text();
                console.log("Respon Backend:", rawText); // <--- LIHAT DI CONSOLE (F12) JIKA GAGAL

                let result;
                try {
                    result = JSON.parse(rawText); // Ubah ke JSON
                } catch (err) {
                    alert("Server Error (Bukan JSON). Cek Console (F12) untuk detail.");
                    btn.disabled = false;
                    btn.textContent = 'Verifikasi';
                    return;
                }

                if (result.status === 'success') {
                    // Berhasil, pindah ke lengkapi profil
                    window.location.href = 'lengkapi_profil.html';
                } else {
                    // Tampilkan pesan error dari BE (misal: OTP salah / kadaluarsa)
                    document.getElementById('err-otp-text').textContent = result.message;
                    document.getElementById('err-otp').classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Verifikasi';
                }
                
            } catch (error) {
                console.error("Error Asli:", error);
                alert('Gagal Terhubung: ' + error.message); 
                btn.disabled = false;
                btn.textContent = 'Verifikasi';
            }
        });
    </script>
</body>
</html>
