<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Password Baru - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --vsq-navy: #131B2E; --vsq-blue: #477FEB; --vsq-red: #FF0000; --vsq-gray: #848484; --vsq-error: #FF5555; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; margin: 0; padding: 0; }

        .vsq-wrapper { display: flex; min-height: 100vh; width: 100%; }
        .vsq-left { flex: 1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 40px 30px; position: relative; }
        .vsq-back-btn { position: absolute; top: 40px; left: 40px; color: #000; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .vsq-back-btn:hover { transform: translateX(-4px); }
        .vsq-back-btn svg { width: 32px; height: 32px; stroke: #000; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .vsq-card { width: 100%; max-width: 380px; text-align: center; }
        
        .vsq-logo { margin-bottom: 24px; }
        .vsq-logo h1 { font-size: 38px; font-weight: 800; color: var(--vsq-navy); margin: 0; letter-spacing: -0.5px; line-height: 1.2; }
        .vsq-logo p { font-size: 22px; font-weight: 800; color: var(--vsq-red); letter-spacing: 0.6px; margin-top: 4px; text-transform: uppercase; line-height: 1.1; }

        .vsq-illustration { margin-bottom: 30px; display: flex; justify-content: center; }
        .vsq-illustration img { width: 200px; height: auto; object-fit: contain; }

        .vsq-form-group { margin-bottom: 20px; text-align: left; position: relative; }
        .vsq-form-group label { display: block; font-size: 13px; font-weight: 500; color: #000; margin-bottom: 6px; }
        .vsq-form-group label span { color: #000; }
        
        .vsq-input-wrapper { position: relative; width: 100%; }
        .vsq-form-control { width: 100%; height: 48px; padding: 10px 16px; padding-right: 45px; font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; border: 1px solid var(--vsq-gray); border-radius: 10px; outline: none; transition: all 0.2s; }
        .vsq-form-control:focus { border-color: var(--vsq-navy); }
        .vsq-form-control.is-invalid { border: 1px solid var(--vsq-error) !important; }

        .vsq-toggle-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #000; background: transparent; border: none; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .vsq-toggle-password svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .vsq-error-msg { display: none; align-items: flex-start; gap: 6px; font-size: 12px; color: var(--vsq-error); margin-top: 6px; font-weight: 500; }
        .vsq-error-msg.show { display: flex; }
        .vsq-error-icon { width: 14px; height: 14px; background: transparent; border: 2px solid var(--vsq-error); color: var(--vsq-error); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; flex-shrink: 0; margin-top: 1px; }

        .vsq-btn { display: block; width: 100%; height: 48px; padding: 0 20px; font-size: 15px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; color: #FFFFFF; background-color: var(--vsq-navy); border: none; border-radius: 12px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .vsq-btn:hover { background-color: #0a0e1a; }

        .vsq-right { flex: 1; background: linear-gradient(rgba(19, 27, 46, 0.6), rgba(19, 27, 46, 0.6)), url('assets/uploads/lapangan/Lapangan2.jpeg') center/cover no-repeat; border-left: 1px solid #000; }

        @media (max-width: 900px) { .vsq-wrapper { flex-direction: column; } .vsq-left { padding: 80px 20px 40px; } .vsq-right { min-height: 200px; order: -1; border-left: none; border-bottom: 1px solid #000; } .vsq-back-btn { top: 20px; left: 20px; } }
    </style>
</head>
<body>
    <div class="vsq-wrapper">
        <div class="vsq-left">
            <a href="verifikasi_lupa.html" class="vsq-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
            
            <div class="vsq-card">
                <div class="vsq-logo"><h1>Vincent'SQ</h1><p>SPORTS ARENA</p></div>
                
                <div class="vsq-illustration">
                    <!-- Ganti src dengan gambar Laptop/Shield sesuai desain UI/UX -->
                    <img src="assets/images/icon-password.png" alt="Ilustrasi Password Baru" onerror="this.src='https://illustrations.popsy.co/blue/security.svg'">
                </div>

                <form id="formPasswordBaru" novalidate>
                    <div class="vsq-form-group">
                        <label>Password Baru<span>*</span></label>
                        <div class="vsq-input-wrapper">
                            <input type="password" id="passwordBaru" class="vsq-form-control" placeholder="Masukkan Password...">
                            <button type="button" class="vsq-toggle-password" onclick="togglePassword('passwordBaru', this)">
                                <svg viewBox="0 0 24 24" class="icon-eye-closed"><path d="M3 10 Q12 18 21 10" /><line x1="3" y1="10" x2="2" y2="13" /><line x1="7" y1="13" x2="5.5" y2="16" /><line x1="12" y1="15" x2="12" y2="18" /><line x1="17" y1="13" x2="18.5" y2="16" /><line x1="21" y1="10" x2="22" y2="13" /></svg>
                                <svg viewBox="0 0 24 24" class="icon-eye-open" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <div class="vsq-error-msg" id="err-pass-kosong"><span class="vsq-error-icon">!</span> Password tidak boleh kosong!</div>
                        <div class="vsq-error-msg" id="err-pass-panjang"><span class="vsq-error-icon">!</span> Password harus terdiri dari minimal 8 karakter</div>
                    </div>

                    <div class="vsq-form-group">
                        <label>Konfirmasi Password<span>*</span></label>
                        <div class="vsq-input-wrapper">
                            <input type="password" id="konfirmasiBaru" class="vsq-form-control" placeholder="Masukkan Password...">
                            <button type="button" class="vsq-toggle-password" onclick="togglePassword('konfirmasiBaru', this)">
                                <svg viewBox="0 0 24 24" class="icon-eye-closed"><path d="M3 10 Q12 18 21 10" /><line x1="3" y1="10" x2="2" y2="13" /><line x1="7" y1="13" x2="5.5" y2="16" /><line x1="12" y1="15" x2="12" y2="18" /><line x1="17" y1="13" x2="18.5" y2="16" /><line x1="21" y1="10" x2="22" y2="13" /></svg>
                                <svg viewBox="0 0 24 24" class="icon-eye-open" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <div class="vsq-error-msg" id="err-konfirmasi-kosong"><span class="vsq-error-icon">!</span> Konfirmasi Password tidak boleh kosong!</div>
                        <div class="vsq-error-msg" id="err-konfirmasi-cocok"><span class="vsq-error-icon">!</span> Password dan konfirmasi Password Tidak Cocok!</div>
                    </div>

                    <button type="submit" class="vsq-btn" id="btnKonfirmasi">Konfirmasi</button>
                </form>
            </div>
        </div>
        <div class="vsq-right"></div>
    </div>

    <script>
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            const iconClosed = iconElement.querySelector('.icon-eye-closed');
            const iconOpen = iconElement.querySelector('.icon-eye-open');
            if (input.type === 'password') { input.type = 'text'; iconClosed.style.display = 'none'; iconOpen.style.display = 'block'; } 
            else { input.type = 'password'; iconClosed.style.display = 'block'; iconOpen.style.display = 'none'; }
        }

        const passInput = document.getElementById('passwordBaru');
        const confirmInput = document.getElementById('konfirmasiBaru');
        const formPasswordBaru = document.getElementById('formPasswordBaru');
        const btnKonfirmasi = document.getElementById('btnKonfirmasi');

        const errPassKosong = document.getElementById('err-pass-kosong');
        const errPassPanjang = document.getElementById('err-pass-panjang');
        const errKonfirmasiKosong = document.getElementById('err-konfirmasi-kosong');
        const errKonfirmasiCocok = document.getElementById('err-konfirmasi-cocok');

        function resetErrors() {
            passInput.classList.remove('is-invalid');
            confirmInput.classList.remove('is-invalid');
            errPassKosong.classList.remove('show');
            errPassPanjang.classList.remove('show');
            errKonfirmasiKosong.classList.remove('show');
            errKonfirmasiCocok.classList.remove('show');
        }

        // Realtime Validasi
        passInput.addEventListener('input', function() {
            resetErrors();
            if (this.value.length > 0 && this.value.length < 8) {
                this.classList.add('is-invalid'); errPassPanjang.classList.add('show');
            }
            if (confirmInput.value.length > 0 && this.value !== confirmInput.value) {
                confirmInput.classList.add('is-invalid'); errKonfirmasiCocok.classList.add('show');
            }
        });

        confirmInput.addEventListener('input', function() {
            resetErrors();
            if (this.value.length > 0 && this.value !== passInput.value) {
                this.classList.add('is-invalid'); errKonfirmasiCocok.classList.add('show');
            }
        });

        // Submit Form
        formPasswordBaru.addEventListener('submit', function(e) {
            e.preventDefault();
            resetErrors();
            let isValid = true;

            if (passInput.value.trim() === '') {
                passInput.classList.add('is-invalid'); errPassKosong.classList.add('show'); isValid = false;
            } else if (passInput.value.length < 8) {
                passInput.classList.add('is-invalid'); errPassPanjang.classList.add('show'); isValid = false;
            }

            if (confirmInput.value.trim() === '') {
                confirmInput.classList.add('is-invalid'); errKonfirmasiKosong.classList.add('show'); isValid = false;
            } else if (confirmInput.value !== passInput.value) {
                confirmInput.classList.add('is-invalid'); errKonfirmasiCocok.classList.add('show'); isValid = false;
            }

            if (!isValid) return;

            btnKonfirmasi.disabled = true; btnKonfirmasi.textContent = 'Menyimpan...';
            setTimeout(() => {
                alert("Password berhasil diubah! Silakan login kembali.");
                localStorage.removeItem('reset_email');
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>
</body>
</html>
