$kind: http-request
url: "{{baseUrl}}/auth/register.php"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nama": "Postman Tester",
      "email": "{{testEmail}}",
      "password": "{{testPassword}}",
      "confirm_password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP status = 200', function () { pm.response.to.have.status(200); });
      pm.test('Response header Content-Type JSON', function () { pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'); });
      let j = {}; try { j = pm.response.json(); } catch(e) { pm.expect.fail('Response bukan JSON valid: ' + e.message); }
      pm.test('Response memiliki struktur JSON standar', function () { pm.expect(j).to.be.an('object'); pm.expect(j).to.have.property('status'); pm.expect(j).to.have.property('message'); });
      pm.test('Status response success', function () { pm.expect(j.status).to.eql('success'); pm.expect(j).to.have.property('data'); });
      pm.test('Register menghasilkan OTP debug dan user id',()=>{pm.expect(j.data).to.have.property('user_id');pm.expect(j.data).to.have.property('otp_debug');});
      pm.collectionVariables.set('testOtp',String(j.data.otp_debug));
    language: text/javascript
  - type: beforeRequest
    code: "const timestamp = Date.now();\r

      \r

      const randomNumber = Math.floor(Math.random() * 10000);\r

      \r

      const email = `postman${timestamp}${randomNumber}@gmail.com`;\r

      \r

      pm.collectionVariables.set(\"testEmail\", email);\r

      \r

      console.log(\"Email registrasi:\", email);"
    language: text/javascript
examples: .resources/08 POST Register - Berhasil membuat user tes.resources/examples
order: 8000
