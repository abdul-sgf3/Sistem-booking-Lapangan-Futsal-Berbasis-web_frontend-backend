<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lengkapi Profil - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS DASAR */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; 
            background: linear-gradient(rgba(19, 27, 46, 0.7), rgba(19, 27, 46, 0.7)), 
                        url('assets/uploads/lapangan/hero.jpeg') center/cover no-repeat fixed;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        /* Tombol Kembali */
        .vsq-back-btn { position: absolute; top: 40px; left: 40px; color: #FFFFFF; text-decoration: none; z-index: 10; }
        .vsq-back-btn svg { width: 32px; height: 32px; stroke: #FFFFFF; stroke-width: 2.5; fill: none; }

        /* Card Putih */
        .vsq-profile-card { 
            background: #FFFFFF; 
            width: 100%; 
            max-width: 400px; 
            border-radius: 15px; 
            padding: 35px 30px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.2); 
            text-align: center;
        }

        /* Logo */
        .vsq-logo { margin-bottom: 2px; }
        .vsq-logo h1 { font-size: 24px; font-weight: 800; color: #131B2E; margin: 0; letter-spacing: -0.5px; }
        .vsq-logo p { font-size: 13px; font-weight: 800; color: #FF0000; letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }

        /* Judul */
        .vsq-title { font-size: 15px; font-weight: 600; color: #000; margin-bottom: 20px; margin-top: 10px; }

        /* Ikon Upload Profil */
        .vsq-upload-container { margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; }
        .vsq-avatar-wrapper { position: relative; width: 90px; height: 90px; margin-bottom: 10px; cursor: pointer; }
        .vsq-avatar-circle { 
            width: 100%; height: 100%; 
            border: 1.5px dashed #477FEB; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; /* Agar gambar tidak keluar dari lingkaran */
        }
        .vsq-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Sembunyikan gambar sebelum diupload */
        }
        .vsq-avatar-circle svg { display: block; }
        
        .vsq-camera-badge { 
            position: absolute; bottom: 0px; right: 0px; 
            background: #477FEB; width: 28px; height: 28px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            border: 2px solid #FFF; cursor: pointer;
        }
        .vsq-upload-text { color: #477FEB; font-size: 12px; font-weight: 500; cursor: pointer; }
        .vsq-upload-hint { color: #000; font-size: 10px; margin-top: 2px; }

        /* Teks Info */
        .vsq-info-text { font-size: 12px; color: #000; margin-bottom: 15px; line-height: 1.5; text-align: left; }

        /* Form Input */
        .vsq-form-group { margin-bottom: 12px; text-align: left; }
        .vsq-form-group label { display: block; font-size: 13px; font-weight: 500; color: #000; margin-bottom: 6px; }
        .vsq-form-group label span { color: #FF0000; }
        .vsq-form-control { 
            width: 100%; height: 40px; padding: 10px 14px; 
            font-size: 12px; font-family: 'Plus Jakarta Sans', sans-serif;
            border: 1px solid #CBD5E1; border-radius: 8px; outline: none; color: #000;
            background-color: #FFFFFF;
        }
        .vsq-form-control:focus { border-color: #477FEB; }
        .vsq-form-control::placeholder { color: #94A3B8; }

        /* Anti Autofill Browser */
        .vsq-form-control:-webkit-autofill,
        .vsq-form-control:-webkit-autofill:hover, 
        .vsq-form-control:-webkit-autofill:focus, 
        .vsq-form-control:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Tombol Simpan Data */
        .vsq-btn-submit { 
            width: 100%; padding: 12px; margin-top: 10px;
            background: #131B2E; 
            color: #FFF; 
            border: none; border-radius: 8px; 
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }
        .vsq-btn-submit:hover { background: #1E293B; }
    </style>
</head>
<body>

    <a href="verifikasi.html" class="vsq-back-btn">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>

    <div class="vsq-profile-card">
        
        <div class="vsq-logo">
            <h1>Vincent'SQ</h1>
            <p>SPORTS ARENA</p>
        </div>
        
        <h2 class="vsq-title">Lengkapi Profil data anda</h2>

        <!-- Upload Foto -->
        <div class="vsq-upload-container">
            <!-- Input file disembunyikan, akan dipicu oleh klik pada wrapper -->
            <input type="file" id="fileUpload" accept="image/png, image/jpeg" style="display: none;">
            
            <div class="vsq-avatar-wrapper" onclick="document.getElementById('fileUpload').click()">
                <div class="vsq-avatar-circle">
                    <!-- Ikon User Biru (Default) -->
                    <svg id="icon-user" width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="#477FEB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <!-- Preview Gambar (Tersembunyi awalnya) -->
                    <img id="preview-img" src="" alt="Preview Foto">
                </div>
                <!-- Ikon Kamera Biru -->
                <div class="vsq-camera-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
            </div>
            
            <span class="vsq-upload-text" onclick="document.getElementById('fileUpload').click()">Unggah foto profil</span>
            <span class="vsq-upload-hint">(JPG atau PNG, maks 2 MB)</span>
        </div>

        <p class="vsq-info-text">
            Email sudah terverifikasi. Isi data singkat ini untuk menyelesaikan register
        </p>

        <form id="profileForm">
            <div class="vsq-form-group">
                <label for="nama">Nama<span>*</span></label>
                <input type="text" id="nama" class="vsq-form-control" placeholder="Masukkan nama..." required>
            </div>

            <div class="vsq-form-group">
                <label for="wa">No. Whatsapp<span>*</span></label>
                <input type="text" id="wa" class="vsq-form-control" placeholder="Masukkan no WA..." required>
            </div>

            <button type="submit" class="vsq-btn-submit" id="btnSimpan">Simpan data</button>
        </form>
    </div>

    <script>
        // --- LOGIKA UPLOAD FOTO ---
        const fileInput = document.getElementById('fileUpload');
        const previewImg = document.getElementById('preview-img');
        const iconUser = document.getElementById('icon-user');

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            
            if (file) {
                // Validasi ukuran (maks 2 MB)
                if (file.size > 2 * 1024 * 1024) {
                    alert('Ukuran foto terlalu besar! Maksimal 2 MB.');
                    fileInput.value = ''; // Reset input
                    return;
                }

                // Tampilkan preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block'; // Munculkan gambar
                    iconUser.style.display = 'none';    // Sembunyikan ikon user
                }
                reader.readAsDataURL(file);
            }
        });

        // --- LOGIKA SIMPAN DATA ---
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSimpan');
            btn.textContent = 'Menyimpan...';
            btn.disabled = true;

            // Simulasi loading
            setTimeout(() => {
                localStorage.removeItem('register_email'); // Bersihkan session
                 window.location.href = 'login.html'; 
            }, 1000);
        });
    </script>
</body>
</html>
