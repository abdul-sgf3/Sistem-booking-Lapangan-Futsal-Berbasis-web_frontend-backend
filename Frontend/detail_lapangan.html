<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Lapangan - Vincent SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/network.css">
    <style>
        :root { --vsq-navy: #131B2E; --vsq-blue: #477FEB; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; }

        /* Skeleton CSS */
        .sl-skeleton { background-color: #E2E8F0; border-radius: 8px; position: relative; overflow: hidden; }
        .sl-skeleton::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 100% { left: 100%; } }
        
        .detail-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; }
        .detail-skeleton-img { height: 400px; border-radius: 16px; }
        .detail-skeleton-form { height: 450px; border-radius: 16px; }

        @media (max-width: 768px) {
            .detail-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header id="navbar"></header>
    <div class="detail-container">
        <div class="sl-skeleton detail-skeleton-img"></div>
        <div class="sl-skeleton detail-skeleton-form"></div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/components.js"></script>
</body>
</html>
