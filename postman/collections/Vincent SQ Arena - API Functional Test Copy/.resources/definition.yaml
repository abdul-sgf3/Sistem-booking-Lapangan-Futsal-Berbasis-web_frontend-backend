  createdLapanganId: ""
  runId: ""
  baseUrl: http://localhost/vincent-arena/Backend/API
  lapanganId: "1"
  tanggalTes: 2026-11-10
  testUserId: "7"
  adminEmail: admin@tsubasa.com
  adminPassword: ""
  bookingId: "5"
  bookingDetailId: "5"
  jamMulaiTes: 09:00
  durasiTes: "1"
  limitTes: "10"
  pageTes: "1"
  kategoriTes: semua
scripts:
  - type: http:beforeRequest
    code: |-
      if (!pm.collectionVariables.get('testEmail')) { pm.collectionVariables.set('testEmail','postman.test.'+Date.now()+'@example.com'); }
      if (!pm.collectionVariables.get('runId')) { pm.collectionVariables.set('runId',String(Date.now())); }
    language: text/javascript
