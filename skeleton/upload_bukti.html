<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Bukti - Vincent SQ Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/network.css">
</head>
<body class="bg-white font-sans">
    <header id="navbar"></header>

    <div class="max-w-md mx-auto my-16 p-8 bg-white rounded-2xl shadow-lg text-center">
        <h2 class="text-2xl font-bold text-navy mb-4">📎 Upload Bukti Transfer</h2>
        <p class="text-slate-500 mb-6">Booking: <strong id="kode-booking">-</strong></p>

        <form id="form-upload" enctype="multipart/form-data">
            <input type="file" name="bukti" accept="image/*" required class="w-full p-3 border rounded-lg mb-4">
            <button type="submit" class="w-full bg-accent text-white py-3 rounded-full font-bold">Upload</button>
        </form>

        <a href="riwayat_booking.html" class="block mt-6 text-slate-400 text-sm">← Kembali</a>
    </div>

    <footer id="footer"></footer>
    <div id="toast-container" class="toast-container"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/network.js"></script>
</body>
</html>
