<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Booking - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS DASAR & NAVBAR */
        :root { --vsq-navy: #131B2E; --vsq-blue: #477FEB; --vsq-red: #FF0000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #F8FAFC; font-family: 'Plus Jakarta Sans', sans-serif; }

        /* Navbar Dinamis */
        .vsq-header { background: #FFFFFF; width: 100%; height: 106px; border-bottom: 1px solid #E2E8F0; position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 44px; box-sizing: border-box; }
        .vsq-logo { display: flex; flex-direction: column; text-decoration: none; width: 115px; }
        .vsq-logo-title { font-size: 21px; font-weight: 700; color: #131B2E; line-height: 18px; letter-spacing: -0.45px; }
        .vsq-logo-sub { font-size: 14px; font-weight: 700; color: #FF0000; line-height: 16px; letter-spacing: 0.6px; margin-top: 4px; }
        .vsq-nav-menu { display: flex; align-items: center; gap: 32px; flex: 1; margin-left: 40px; }
        .vsq-nav-link { font-size: 14px; font-weight: 600; color: #000000; text-decoration: none; transition: color 0.2s; }
        .vsq-nav-link:hover { color: var(--vsq-blue); }
        .vsq-nav-link.active { color: #FFFFFF; background: #131B2E; padding: 15px 17px; border-radius: 15px; height: 54px; display: flex; align-items: center; justify-content: center; }
        
        .vsq-nav-right { display: flex; align-items: center; gap: 16px; }
        .vsq-notif-btn { background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 47px; height: 47px; }
        .vsq-notif-btn svg { width: 28px; height: 28px; stroke: #000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .vsq-profile-box { display: flex; align-items: center; justify-content: space-between; width: 153px; height: 63px; border: 1px solid #000000; border-radius: 20px; padding: 0 10px 0 17px; cursor: pointer; text-decoration: none; }
        .vsq-profile-name { font-size: 18px; color: #000; white-space: nowrap; font-weight: 400; }
        .vsq-profile-avatar { width: 42px; height: 42px; background: #D9D9D9; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; }
        
        .vsq-btn-login-outline { background: #FFFFFF; color: #131B2E; border: 1px solid #131B2E; width: 120px; height: 50px; border-radius: 15px; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .vsq-btn-register { background: #131B2E; color: #FFF; width: 120px; height: 50px; border-radius: 15px; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; }

        /* KONTEN */
        .vsq-section { padding: 50px 20px; max-width: 1000px; margin: 0 auto; text-align: center; }
        .vsq-section-title h2 { font-size: 36px; font-weight: 700; color: #131B2E; margin-bottom: 20px; }
        .sl-skeleton { background-color: #E2E8F0; border-radius: 8px; position: relative; overflow: hidden; }
        .sl-skeleton::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 100% { left: 100%; } }
        .skeleton-card { height: 120px; border-radius: 12px; margin-bottom: 20px; background: #E2E8F0; }

        @media (max-width: 767px) {
            .vsq-header { padding: 15px 20px; flex-wrap: wrap; height: auto; }
            .vsq-nav-menu { display: none; }
        }
    </style>
</head>
<body>

    <header id="navbar"></header>

    <section class="vsq-section">
        <div class="vsq-section-title">
            <h2>Riwayat Booking</h2>
        </div>
        <div id="riwayat-container">
            <div class="sl-skeleton skeleton-card"></div>
            <div class="sl-skeleton skeleton-card"></div>
            <div class="sl-skeleton skeleton-card"></div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Render Navbar
            const navbarEl = document.getElementById('navbar');
            const isLoggedIn = localStorage.getItem('user_id') !== null; 
            const rawNama = localStorage.getItem('nama'); 
            let displayName = (rawNama && rawNama !== 'undefined' && rawNama !== 'null' && rawNama.trim() !== '') ? rawNama : 'User';

            let rightNavHTML = isLoggedIn ? `
                <button class="vsq-notif-btn"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path><path d="M4 3L2 5"></path><path d="M20 3L22 5"></path></svg></button>
                <div class="vsq-profile-box" onclick="logout()"><span class="vsq-profile-name">Hai ${displayName}</span><div class="vsq-profile-avatar">${displayName.charAt(0).toUpperCase()}</div></div>
            ` : `
                <a href="login.html" class="vsq-btn-login-outline">Login</a>
                <a href="register.html" class="vsq-btn-register">Register</a>
            `;

            navbarEl.innerHTML = `
            <div class="vsq-header">
                <a href="index.html" class="vsq-logo"><span class="vsq-logo-title">Vincent'SQ</span><span class="vsq-logo-sub">SPORTS ARENA</span></a>
                <nav class="vsq-nav-menu">
                    <a href="index.html" class="vsq-nav-link">Beranda</a>
                    <a href="lapangan.html" class="vsq-nav-link">Booking Lapangan</a>
                    <a href="riwayat.html" class="vsq-nav-link active">Riwayat Booking</a>
                    <a href="makanan.html" class="vsq-nav-link">Makanan Minuman</a>
                </nav>
                <div class="vsq-nav-right">${rightNavHTML}</div>
            </div>`;

            // Simulasi Loading Data
            setTimeout(() => {
                document.getElementById('riwayat-container').innerHTML = '<p style="text-align:center; color:#64748B; font-size:18px; margin-top:40px;">Belum ada riwayat booking.</p>';
            }, 1000);
        });

        function logout() { if(confirm('Keluar?')) { localStorage.clear(); window.location.reload(); } }
    </script>
</body>
</html>
