$kind: http-example
name: "S4 - Setup: Register Akun Belum Terverifikasi"
request:
  url: "{{base_url}}/{{backend_path}}/auth/register.php"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "{{login_unverified_email}}",
        "password": "{{login_password}}",
        "confirm_password": "{{login_password}}"
      }
