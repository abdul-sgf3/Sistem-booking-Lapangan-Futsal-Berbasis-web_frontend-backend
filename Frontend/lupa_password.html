<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --vsq-navy:#131B2E; --vsq-blue:#477FEB; --vsq-red:#FF0000; --vsq-gray:#848484; --vsq-error:#F04B4B; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh; }
        .vsq-wrapper { display:flex; min-height:100vh; width:100%; }
        .vsq-left { flex:1; background:#fff; display:flex; align-items:center; justify-content:center; padding:40px 30px; position:relative; }
        .vsq-back-btn { position:absolute; top:40px; left:40px; display:flex; transition:transform .2s; }
        .vsq-back-btn:hover { transform:translateX(-4px); }
        .vsq-back-btn svg { width:32px; height:32px; stroke:#000; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
        .vsq-card { width:100%; max-width:380px; text-align:center; }
        .vsq-logo h1 { font-size:38px; font-weight:800; color:var(--vsq-navy); letter-spacing:-.5px; line-height:1.2; }
        .vsq-logo p { font-size:22px; font-weight:800; color:var(--vsq-red); letter-spacing:.6px; margin-top:4px; line-height:1.1; }
        .vsq-title { font-size:20px; font-weight:700; color:#111827; margin:28px 0 8px; }
        .vsq-text { font-size:14px; color:#4B5563; line-height:1.5; margin-bottom:28px; }
        .vsq-form-group { text-align:left; margin-bottom:20px; }
        .vsq-form-group label { display:block; font-size:14px; font-weight:500; color:#111827; margin-bottom:8px; }
        .vsq-form-control { width:100%; height:52px; padding:0 18px; font-size:15px; font-family:inherit; border:1px solid var(--vsq-gray); border-radius:12px; outline:none; transition:border-color .2s; }
        .vsq-form-control:focus { border-color:var(--vsq-navy); }
        .vsq-form-control.is-invalid { border-color:var(--vsq-error); }
        .vsq-error-msg { display:none; align-items:flex-start; gap:6px; font-size:12px; color:var(--vsq-error); margin-top:6px; font-weight:500; }
        .vsq-error-msg.show { display:flex; }
        .vsq-error-icon { width:14px; height:14px; border:1.5px solid var(--vsq-error); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; flex-shrink:0; margin-top:1px; }
        .vsq-btn { width:100%; height:50px; font-size:16px; font-weight:600; font-family:inherit; color:#fff; background:var(--vsq-navy); border:none; border-radius:14px; cursor:pointer; transition:background .2s; }
        .vsq-btn:hover { background:#0a0e1a; }
        .vsq-btn:disabled { opacity:.6; cursor:not-allowed; }
        .vsq-right { flex:1; background:linear-gradient(rgba(19,27,46,.6),rgba(19,27,46,.6)),url('assets/uploads/lapangan/Lapangan2.jpeg') center/cover no-repeat; }
        @media (max-width:900px) {
            .vsq-wrapper { flex-direction:column; }
            .vsq-left { padding:80px 20px 40px; }
            .vsq-right { min-height:200px; order:-1; }
            .vsq-back-btn { top:20px; left:20px; }
        }
    </style>
</head>
<body>
    <div class="vsq-wrapper">
        <div class="vsq-left">
            <a href="login.html" class="vsq-back-btn" aria-label="Kembali ke login"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
            <div class="vsq-card">
                <div class="vsq-logo"><h1>Vincent'SQ</h1><p>SPORTS ARENA</p></div>
                <h2 class="vsq-title">Lupa password?</h2>
                <p class="vsq-text">Masukkan email akun Anda. Kami akan mengirim kode verifikasi untuk mengatur ulang password.</p>
                <form id="formLupa" novalidate>
                    <div class="vsq-form-group">
                        <label for="email">Email*</label>
                        <input type="text" inputmode="email" autocomplete="email" id="email" class="vsq-form-control" placeholder="Masukkan email...">
                        <div class="vsq-error-msg" id="err-email"><span class="vsq-error-icon">!</span><span id="err-email-text"></span></div>
                    </div>
                    <button type="submit" class="vsq-btn" id="btnKirim">Kirim kode</button>
                </form>
            </div>
        </div>
        <div class="vsq-right"></div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        const form = document.getElementById('formLupa');
        const emailInput = document.getElementById('email');
        const errEl = document.getElementById('err-email');
        const errText = document.getElementById('err-email-text');
        const btn = document.getElementById('btnKirim');
        const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function setError(msg) {
            errText.textContent = msg;
            errEl.classList.add('show');
            emailInput.classList.add('is-invalid');
        }
        function clearError() { errEl.classList.remove('show'); emailInput.classList.remove('is-invalid'); }

        function validate() {
            const v = emailInput.value.trim();
            if (v === '') { setError('Email tidak boleh kosong'); return false; }
            if (/\s/.test(emailInput.value)) { setError('Email tidak boleh menggunakan spasi!'); return false; }
            if (!EMAIL_REGEX.test(v)) { setError('Email harus mengandung karakter @ dan .'); return false; }
            clearError(); return true;
        }
        emailInput.addEventListener('input', () => { if (emailInput.value) validate(); else clearError(); });

        let busy = false;
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (busy || !validate()) return;
            busy = true; btn.disabled = true; btn.textContent = 'Mengirim...';

            const email = emailInput.value.trim().toLowerCase();
            const r = await apiPost('/auth/lupa_password.php', { email });

            if (r.ok) {
                localStorage.setItem('reset_email', email);
                window.location.href = 'verifikasi_lupa.html';
                return;
            }
            if (r.networkError) setError('Tidak dapat terhubung ke server. Periksa koneksi Anda.');
            else setError(r.message || 'Terjadi kesalahan. Silakan coba lagi.');
            busy = false; btn.disabled = false; btn.textContent = 'Kirim kode';
        });
    </script>
</body>
</html>
