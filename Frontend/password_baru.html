<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Password Baru - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --vsq-navy:#131B2E; --vsq-blue:#477FEB; --vsq-red:#FF0000; --vsq-gray:#848484; --vsq-error:#FF5555; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh; }
        .vsq-wrapper { display:flex; min-height:100vh; width:100%; }
        .vsq-left { flex:1; background:#fff; display:flex; align-items:center; justify-content:center; padding:40px 30px; position:relative; }
        .vsq-back-btn { position:absolute; top:40px; left:40px; display:flex; transition:transform .2s; }
        .vsq-back-btn:hover { transform:translateX(-4px); }
        .vsq-back-btn svg { width:32px; height:32px; stroke:#000; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
        .vsq-card { width:100%; max-width:380px; text-align:center; }
        .vsq-logo { margin-bottom:24px; }
        .vsq-logo h1 { font-size:38px; font-weight:800; color:var(--vsq-navy); letter-spacing:-.5px; line-height:1.2; }
        .vsq-logo p { font-size:22px; font-weight:800; color:var(--vsq-red); letter-spacing:.6px; margin-top:4px; text-transform:uppercase; line-height:1.1; }
        .vsq-illustration { margin-bottom:30px; display:flex; justify-content:center; }
        .vsq-illustration img { width:200px; height:auto; object-fit:contain; }
        .vsq-form-group { margin-bottom:20px; text-align:left; position:relative; }
        .vsq-form-group label { display:block; font-size:13px; font-weight:500; color:#000; margin-bottom:6px; }
        .vsq-input-wrapper { position:relative; width:100%; }
        .vsq-form-control { width:100%; height:48px; padding:10px 45px 10px 16px; font-size:14px; font-family:inherit; background:#fff; border:1px solid var(--vsq-gray); border-radius:10px; outline:none; transition:all .2s; }
        .vsq-form-control:focus { border-color:var(--vsq-navy); }
        .vsq-form-control.is-invalid { border:1px solid var(--vsq-error) !important; }
        .vsq-toggle-password { position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; color:#000; background:transparent; border:none; display:flex; align-items:center; justify-content:center; z-index:2; }
        .vsq-toggle-password svg { width:20px; height:20px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
        .vsq-error-msg { display:none; align-items:flex-start; gap:6px; font-size:12px; color:var(--vsq-error); margin-top:6px; font-weight:500; }
        .vsq-error-msg.show { display:flex; }
        .vsq-error-icon { width:14px; height:14px; border:2px solid var(--vsq-error); color:var(--vsq-error); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; flex-shrink:0; margin-top:1px; }
        .vsq-btn { display:block; width:100%; height:48px; padding:0 20px; font-size:15px; font-weight:600; font-family:inherit; color:#fff; background:var(--vsq-navy); border:none; border-radius:12px; cursor:pointer; transition:background .2s; margin-top:10px; }
        .vsq-btn:hover { background:#0a0e1a; }
        .vsq-btn:disabled { opacity:.6; cursor:not-allowed; }
        .vsq-right { flex:1; background:linear-gradient(rgba(19,27,46,.6),rgba(19,27,46,.6)),url('assets/uploads/lapangan/Lapangan2.jpeg') center/cover no-repeat; border-left:1px solid #000; }
        @media (max-width:900px) {
            .vsq-wrapper { flex-direction:column; }
            .vsq-left { padding:80px 20px 40px; }
            .vsq-right { min-height:200px; order:-1; border-left:none; border-bottom:1px solid #000; }
            .vsq-back-btn { top:20px; left:20px; }
        }
    </style>
</head>
<body>
    <div class="vsq-wrapper">
        <div class="vsq-left">
            <a href="verifikasi_lupa.html" class="vsq-back-btn" aria-label="Kembali"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>

            <div class="vsq-card">
                <div class="vsq-logo"><h1>Vincent'SQ</h1><p>SPORTS ARENA</p></div>

                <div class="vsq-illustration">
                    <img src="assets/images/icon-password.png" alt="Ilustrasi Password Baru" onerror="this.src='https://illustrations.popsy.co/blue/security.svg'">
                </div>

                <form id="formPasswordBaru" novalidate>
                    <div class="vsq-form-group">
                        <label for="passwordBaru">Password Baru*</label>
                        <div class="vsq-input-wrapper">
                            <input type="password" id="passwordBaru" autocomplete="new-password" class="vsq-form-control" placeholder="Masukkan Password...">
                            <button type="button" class="vsq-toggle-password" aria-label="Tampilkan / sembunyikan password" onclick="togglePassword('passwordBaru', this)">
                                <svg viewBox="0 0 24 24" class="icon-eye-closed"><path d="M3 10 Q12 18 21 10"/><line x1="3" y1="10" x2="2" y2="13"/><line x1="7" y1="13" x2="5.5" y2="16"/><line x1="12" y1="15" x2="12" y2="18"/><line x1="17" y1="13" x2="18.5" y2="16"/><line x1="21" y1="10" x2="22" y2="13"/></svg>
                                <svg viewBox="0 0 24 24" class="icon-eye-open" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <div class="vsq-error-msg" id="err-pass"><span class="vsq-error-icon">!</span><span id="err-pass-text"></span></div>
                    </div>

                    <div class="vsq-form-group">
                        <label for="konfirmasiBaru">Konfirmasi Password*</label>
                        <div class="vsq-input-wrapper">
                            <input type="password" id="konfirmasiBaru" autocomplete="new-password" class="vsq-form-control" placeholder="Masukkan Password...">
                            <button type="button" class="vsq-toggle-password" aria-label="Tampilkan / sembunyikan password" onclick="togglePassword('konfirmasiBaru', this)">
                                <svg viewBox="0 0 24 24" class="icon-eye-closed"><path d="M3 10 Q12 18 21 10"/><line x1="3" y1="10" x2="2" y2="13"/><line x1="7" y1="13" x2="5.5" y2="16"/><line x1="12" y1="15" x2="12" y2="18"/><line x1="17" y1="13" x2="18.5" y2="16"/><line x1="21" y1="10" x2="22" y2="13"/></svg>
                                <svg viewBox="0 0 24 24" class="icon-eye-open" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <div class="vsq-error-msg" id="err-konf"><span class="vsq-error-icon">!</span><span id="err-konf-text"></span></div>
                    </div>

                    <button type="submit" class="vsq-btn" id="btnKonfirmasi">Konfirmasi</button>
                </form>
            </div>
        </div>
        <div class="vsq-right"></div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const closed = btn.querySelector('.icon-eye-closed');
            const open = btn.querySelector('.icon-eye-open');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            closed.style.display = show ? 'none' : 'block';
            open.style.display = show ? 'block' : 'none';
        }

        const passInput = document.getElementById('passwordBaru');
        const confInput = document.getElementById('konfirmasiBaru');
        const form = document.getElementById('formPasswordBaru');
        const btn = document.getElementById('btnKonfirmasi');
        const errPass = document.getElementById('err-pass');
        const errPassText = document.getElementById('err-pass-text');
        const errKonf = document.getElementById('err-konf');
        const errKonfText = document.getElementById('err-konf-text');

        function setErr(box, textEl, input, msg) { textEl.textContent = msg; box.classList.add('show'); input.classList.add('is-invalid'); }
        function clearErr(box, input) { box.classList.remove('show'); input.classList.remove('is-invalid'); }

        // Validasi tampil bila submit = true (menampilkan juga pesan "kosong")
        function validate(strict) {
            let ok = true;
            clearErr(errPass, passInput); clearErr(errKonf, confInput);

            if (passInput.value.trim() === '') {
                if (strict) { setErr(errPass, errPassText, passInput, 'Password tidak boleh kosong!'); }
                ok = false;
            } else if (passInput.value.length < 8) {
                setErr(errPass, errPassText, passInput, 'Password harus terdiri dari minimal 8 karakter');
                ok = false;
            }

            if (confInput.value.trim() === '') {
                if (strict) { setErr(errKonf, errKonfText, confInput, 'Konfirmasi Password tidak boleh kosong!'); }
                ok = false;
            } else if (confInput.value !== passInput.value) {
                setErr(errKonf, errKonfText, confInput, 'Password dan konfirmasi Password tidak cocok!');
                ok = false;
            }
            return ok;
        }
        passInput.addEventListener('input', () => validate(false));
        confInput.addEventListener('input', () => validate(false));

        let busy = false;
        form.addEventListener('submit', async e => {
            e.preventDefault();
            if (busy || !validate(true)) return;
            busy = true; btn.disabled = true; btn.textContent = 'Menyimpan...';

            const r = await apiPost('/auth/reset_password.php', {
                password: passInput.value,
                confirm_password: confInput.value
            });

            if (r.ok) {
                localStorage.removeItem('reset_email');
                alert('Password berhasil diubah! Silakan login kembali.');
                window.location.href = r.data.redirect || 'login.html';
                return;
            }

            if (r.status === 403) {   // sesi reset habis / OTP belum diverifikasi
                alert(r.message || 'Sesi habis. Ulangi proses reset password.');
                window.location.href = 'lupa_password.html';
                return;
            }

            setErr(errPass, errPassText, passInput,
                r.networkError ? 'Tidak dapat terhubung ke server.' : (r.message || 'Gagal mengubah password.'));
            busy = false; btn.disabled = false; btn.textContent = 'Konfirmasi';
        });
    </script>
</body>
</html>
