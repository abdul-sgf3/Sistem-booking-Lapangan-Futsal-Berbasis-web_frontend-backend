<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Lapangan - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. CSS DASAR & NAVBAR (SESUAI INDEX TERBARU)
           ========================================= */
        :root {
            --vsq-navy: #131B2E;
            --vsq-blue: #477FEB;
            --vsq-red: #FF0000;
            --vsq-gray: #848484;
            --vsq-lightgray: #E2E8F0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #F8FAFC; font-family: 'Plus Jakarta Sans', sans-serif; }

        /* Navbar */
        .vsq-header { background: #FFFFFF; width: 100%; height: 106px; border-bottom: 1px solid #E2E8F0; position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 44px; box-sizing: border-box; }
        .vsq-logo { display: flex; flex-direction: column; text-decoration: none; width: 115px; }
        .vsq-logo-title { font-size: 21px; font-weight: 700; color: #131B2E; line-height: 18px; letter-spacing: -0.45px; }
        .vsq-logo-sub { font-size: 14px; font-weight: 700; color: #FF0000; line-height: 16px; letter-spacing: 0.6px; margin-top: 4px; }
        .vsq-nav-menu { display: flex; align-items: center; gap: 32px; flex: 1; margin-left: 40px; }
        .vsq-nav-link { font-size: 14px; font-weight: 600; color: #000000; text-decoration: none; transition: color 0.2s; }
        .vsq-nav-link:hover { color: var(--vsq-blue); }
        .vsq-nav-link.active { color: #FFFFFF; background: #131B2E; padding: 15px 17px; border-radius: 15px; height: 54px; display: flex; align-items: center; justify-content: center; }
        
        .vsq-nav-right { display: flex; align-items: center; gap: 12px; }
        
        /* TOMBOL LOGIN & REGISTER (SESUAI INDEX: OUTLINE HITAM & SOLID HITAM) */
        .vsq-btn-login-outline { 
            background: #FFFFFF; 
            color: #131B2E; 
            border: 1px solid #131B2E; 
            width: 120px; 
            height: 50px; 
            border-radius: 15px; 
            font-size: 16px; 
            font-weight: 600; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .vsq-btn-register { 
            background: #131B2E; 
            color: #FFF; 
            width: 120px; 
            height: 50px; 
            border-radius: 15px; 
            font-size: 16px; 
            font-weight: 600; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        /* =========================================
           2. CSS SECTION & SKELETON GRID
           ========================================= */
        .vsq-section { padding: 50px 20px; max-width: 1242px; margin: 0 auto; }
        .vsq-section-title { text-align: center; margin-bottom: 40px; }
        .vsq-section-title h2 { font-size: 36px; font-weight: 700; color: #131B2E; margin-bottom: 8px; }
        .vsq-section-title p { font-size: 18px; color: #64748B; }

        /* GRID UNTUK SKELETON (3 KOLOM SEJAJAR) */
        .vsq-lapangan-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 24px; 
        }

        /* CARD SKELETON */
        .sl-card { 
            background: #FFFFFF; 
            border: 1px solid #E2E8F0; 
            border-radius: 20px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
        }

        /* SKELETON ANIMASI */
        .sl-skeleton { 
            background-color: #E2E8F0; 
            border-radius: 6px; 
            position: relative; 
            overflow: hidden; 
        }
        .sl-skeleton::after { 
            content: ''; 
            position: absolute; 
            top: 0; left: -100%; 
            width: 50%; height: 100%; 
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); 
            animation: shimmer 1.5s infinite; 
        }
        @keyframes shimmer { 100% { left: 100%; } }

        /* UKURAN SKELETON */
        .sl-img { 
            height: 250px; 
            width: 100%; 
            border-radius: 20px 20px 0 0; 
        }
        .sl-content { 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .sl-title { height: 24px; width: 60%; }
        .sl-text { height: 16px; width: 100%; }
        .sl-text.short { width: 70%; }
        .sl-btn { height: 45px; width: 100%; margin-top: 15px; border-radius: 10px;}

    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="vsq-header">
        <a href="index.html" class="vsq-logo">
            <span class="vsq-logo-title">Vincent'SQ</span>
            <span class="vsq-logo-sub">SPORTS ARENA</span>
        </a>
        <nav class="vsq-nav-menu">
            <a href="index.html" class="vsq-nav-link">Beranda</a>
            <a href="lapangan.html" class="vsq-nav-link active">Booking Lapangan</a>
            <a href="riwayat.html" class="vsq-nav-link">Riwayat Booking</a>
            <a href="makanan.html" class="vsq-nav-link">Makanan Minuman</a>
        </nav>
        <div class="vsq-nav-right">
            <a href="login.html" class="vsq-btn-login-outline">Login</a>
            <a href="register.html" class="vsq-btn-register">Register</a>
        </div>
    </header>

    <!-- SECTION DAFTAR LAPANGAN -->
    <section class="vsq-section">
        <div class="vsq-section-title">
            <h2>Pilihan Lapangan Tersedia</h2>
            <p>Pilih lapangan favoritmu dan mulai bermain!</p>
        </div>
        
        <!-- WADAH GRID SKELETON -->
        <div class="vsq-lapangan-grid" id="lapangan-container">
            
            <!-- SKELETON 1 -->
            <div class="sl-card">
                <div class="sl-skeleton sl-img"></div>
                <div class="sl-content">
                    <div class="sl-skeleton sl-title"></div>
                    <div class="sl-skeleton sl-text"></div>
                    <div class="sl-skeleton sl-text short"></div>
                    <div class="sl-skeleton sl-btn"></div>
                </div>
            </div>

            <!-- SKELETON 2 -->
            <div class="sl-card">
                <div class="sl-skeleton sl-img"></div>
                <div class="sl-content">
                    <div class="sl-skeleton sl-title"></div>
                    <div class="sl-skeleton sl-text"></div>
                    <div class="sl-skeleton sl-text short"></div>
                    <div class="sl-skeleton sl-btn"></div>
                </div>
            </div>

            <!-- SKELETON 3 -->
            <div class="sl-card">
                <div class="sl-skeleton sl-img"></div>
                <div class="sl-content">
                    <div class="sl-skeleton sl-title"></div>
                    <div class="sl-skeleton sl-text"></div>
                    <div class="sl-skeleton sl-text short"></div>
                    <div class="sl-skeleton sl-btn"></div>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
