<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Email - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS DASAR */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* BACKGROUND GELAP (Gambar Lapangan) */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; 
            background: linear-gradient(rgba(19, 27, 46, 0.7), rgba(19, 27, 46, 0.7)), 
                        url('assets/uploads/lapangan/hero.jpeg') center/cover no-repeat fixed;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        /* Tombol Kembali */
        .vsq-back-btn { position: absolute; top: 40px; left: 40px; color: #FFFFFF; text-decoration: none; z-index: 10; }
        .vsq-back-btn svg { width: 32px; height: 32px; stroke: #FFFFFF; stroke-width: 2.5; fill: none; }

        /* Card Abu-Abu (Sesuai Wireframe) */
        .vsq-verify-card { 
            background: #D9D9D9; 
            width: 100%; 
            max-width: 460px; 
            height: 658px; 
            border-radius: 20px; 
            padding: 40px 35px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.3); 
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Logo */
        .vsq-logo { margin-bottom: 20px; }
        .vsq-logo h1 { font-size: 28px; font-weight: 800; color: #131B2E; margin: 0; }
        .vsq-logo p { font-size: 14px; font-weight: 800; color: #FF0000; letter-spacing: 1.5px; margin-top: 4px; }

        /* Kotak Gambar Ilustrasi 188x188 (Sesuai Wireframe) */
        .vsq-illustration { 
            width: 188px; 
            height: 188px; 
            background: #FFFFFF; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 20px;
        }
        .vsq-illustration img { width: 100%; height: 100%; object-fit: contain; }

        /* Teks Verifikasi */
        .vsq-text { font-size: 14px; color: #333; line-height: 1.5; margin-bottom: 20px; }
        .vsq-text strong { color: #131B2E; font-weight: 700; display: block; margin-top: 4px; font-size: 15px; }

        /* Kotak OTP (Sesuai Wireframe: 45x60) */
        .vsq-otp-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .vsq-otp-input { 
            width: 45px; 
            height: 60px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: 600; 
            color: #333; 
            border: 1px solid rgba(0, 0, 0, 0.3); 
            border-radius: 8px; 
            outline: none; 
            background: #FFFFFF;
        }
        .vsq-otp-input:focus { border-color: #477FEB; }

        /* Timer */
        .vsq-timer-text { font-size: 13px; color: #4B5563; margin-bottom: 20px; }
        .vsq-timer-text span { color: #477FEB; font-weight: 600; }

        /* Tombol Verifikasi (Sesuai Wireframe: Putih 222x53) */
        .vsq-btn { 
            background: #FFFFFF; 
            color: #131B2E; 
            border: 1px solid #FFFFFF; 
            width: 222px; 
            height: 53px; 
            border-radius: 15px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            bottom: 40px;
        }
        .vsq-btn:hover { background: #F3F4F6; }

    </style>
</head>
<body>

    <a href="register.html" class="vsq-back-btn">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>

    <div class="vsq-verify-card">
        
        <div class="vsq-logo">
            <h1>Vincent'SQ</h1>
            <p>SPORTS ARENA</p>
        </div>

        <!-- ILUSTRASI KURIR DIPANGGIL DARI FOLDER ASSETS -->
        <div class="vsq-illustration">
            <img src="assets/images/ilustrasi-kurir.png" alt="Ilustrasi Kurir">
        </div>

        <div class="vsq-text">
            Kami telah mengirimkan kode verifikasi ke
            <strong id="email-target">email@anda.com</strong>
        </div>

        <form id="otpForm" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <div class="vsq-otp-container">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 1)" autofocus>
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 2)">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 3)">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 4)">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 5)">
            </div>

            <div class="vsq-timer-text">Kode akan kadaluwarsa dalam <span id="timer">01:32</span></div>

            <button type="submit" class="vsq-btn">Verifikasi</button>
        </form>

    </div>

    <script>
        // 1. Tampilkan Email dari halaman Register
        const savedEmail = localStorage.getItem('register_email');
        if(savedEmail) {
            document.getElementById('email-target').textContent = savedEmail;
        } else {
            window.location.href = 'register.html';
        }

        // 2. Auto-focus antar kotak OTP
        function moveFocus(current, nextIndex) {
            if (current.value.length === 1) {
                const inputs = document.querySelectorAll('.vsq-otp-input');
                if (nextIndex < inputs.length) {
                    inputs[nextIndex].focus();
                }
            }
        }

        // 3. Timer Hitung Mundur
        let timeLeft = 92;
        const timerEl = document.getElementById('timer');
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerEl.textContent = "00:00";
                return;
            }
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }, 1000);

        // 4. Proses Submit
        document.getElementById('otpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Ambil semua angka OTP
            const inputs = document.querySelectorAll('.vsq-otp-input');
            let code = '';
            inputs.forEach(input => code += input.value);
            
            // Validasi: Pastikan 5 kotak terisi
            if (code.length < 5) {
                alert("Mohon isi semua 5 kotak kode verifikasi!");
                return;
            }

            // BYPASS: Apapun kodenya, langsung ke halaman lengkapi profil
            window.location.href = 'lengkapi_profil.html';
        });
    </script>
</body>
</html>
