<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --vsq-navy: #2C437B; --vsq-blue: #477FEB; --vsq-red: #FF0000; --vsq-gray: #D1D5DB; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; margin: 0; padding: 0; }

        .vsq-wrapper { display: flex; min-height: 100vh; width: 100%; }

        /* Kiri: Form Putih */
        .vsq-left { flex: 1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 40px 30px; position: relative; }
        .vsq-back-btn { position: absolute; top: 40px; left: 40px; color: #000; text-decoration: none; }
        .vsq-back-btn svg { width: 32px; height: 32px; stroke: #000; stroke-width: 2.5; fill: none; }

        .vsq-card { width: 100%; max-width: 400px; text-align: center; }
        .vsq-logo h1 { font-size: 28px; font-weight: 800; color: var(--vsq-navy); margin: 0; }
        .vsq-logo p { font-size: 14px; font-weight: 800; color: var(--vsq-red); letter-spacing: 1.5px; margin-top: 4px; }
        
        .vsq-title { font-size: 18px; font-weight: 700; color: #000; margin: 30px 0 8px 0; }
        .vsq-subtitle { font-size: 13px; color: #4B5563; margin-bottom: 24px; line-height: 1.5; }

        .vsq-illustration img { width: 150px; height: auto; margin-bottom: 24px; }

        .vsq-form-group { margin-bottom: 20px; text-align: left; }
        .vsq-form-group label { display: block; font-size: 13px; font-weight: 500; color: #000; margin-bottom: 6px; }
        .vsq-form-group label span { color: var(--vsq-red); }
        .vsq-form-control { width: 100%; padding: 12px 16px; font-size: 14px; background-color: #FFFFFF; border: 1px solid var(--vsq-gray); border-radius: 8px; outline: none; transition: all 0.2s; }
        .vsq-form-control:focus { border-color: var(--vsq-blue); }

        .vsq-btn { display: block; width: 100%; padding: 12px 20px; font-size: 14px; font-weight: 600; color: #FFFFFF; background-color: var(--vsq-blue); border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .vsq-btn:hover { background-color: #3564C6; }

        /* Kanan: Gambar */
        .vsq-right { flex: 1; background: linear-gradient(rgba(19, 27, 46, 0.7), rgba(19, 27, 46, 0.7)), url('assets/uploads/lapangan/hero.jpeg') center/cover no-repeat; }

        @media (max-width: 900px) { .vsq-wrapper { flex-direction: column; } .vsq-left { padding: 40px 20px; } .vsq-right { min-height: 200px; order: -1; } }
    </style>
</head>
<body>
    <div class="vsq-wrapper">
        <div class="vsq-left">
            <a href="login.html" class="vsq-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
            
            <div class="vsq-card">
                <div class="vsq-logo">
                    <h1>Vincent'SQ</h1>
                    <p>SPORTS ARENA</p>
                </div>
                
                <div class="vsq-title">Lupa Password?</div>
                <div class="vsq-subtitle">Jangan khawatir, kami akan membantumu mereset password</div>
                
                <div class="vsq-illustration">
                    <img src="assets/images/ilustrasi-kurir.jpg" alt="Ilustrasi" onerror="this.src='https://illustrations.popsy.co/blue/forgot-password.svg'">
                </div>
                
                <form id="formLupa">
                    <div class="vsq-form-group">
                        <label for="email">Email<span>*</span></label>
                        <input type="email" id="email" class="vsq-form-control" placeholder="Masukkan email..." required>
                    </div>
                    <button type="submit" class="vsq-btn">Verifikasi</button>
                </form>
            </div>
        </div>
        <div class="vsq-right"></div>
    </div>

    <script>
        document.getElementById('formLupa').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simpan email sementara untuk halaman selanjutnya
            localStorage.setItem('reset_email', document.getElementById('email').value);
            window.location.href = 'verifikasi_lupa.html';
        });
    </script>
</body>
</html>
