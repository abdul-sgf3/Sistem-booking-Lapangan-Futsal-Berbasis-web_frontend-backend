$kind: http-example
name: "S1 - Setup: Register Akun Login"
request:
  url: "{{base_url}}/{{backend_path}}/auth/register.php"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "{{login_email}}",
        "password": "{{login_password}}",
        "confirm_password": "{{login_password}}"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Date: Thu, 19 Nov 2026 10:03:38 GMT
    Server: Apache/2.4.58 (Win64) OpenSSL/3.1.3 PHP/8.2.12
    X-Powered-By: PHP/8.2.12
    Vary: Origin
    Access-Control-Allow-Methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
    Access-Control-Allow-Headers: Content-Type, Authorization, X-Requested-With, Accept
    Access-Control-Max-Age: "86400"
    X-Content-Type-Options: nosniff
    Expires: Thu, 19 Nov 1981 08:52:00 GMT
    Cache-Control: no-store, no-cache, must-revalidate
    Pragma: no-cache
    Content-Length: "295"
    Keep-Alive: timeout=5, max=100
    Connection: Keep-Alive
    Content-Type: application/json; charset=UTF-8
  body:
    type: json
    content: |-
      {
        "status": "success",
        "message": "Registrasi berhasil, tetapi email OTP gagal dikirim. Silakan gunakan tombol Kirim Ulang.",
        "data": {
          "user_id": 32,
          "email": "login.1795082617922.37548@example.com",
          "email_sent": false,
          "expired_at": "2026-11-19 17:08:38",
          "redirect": "verifikasi.html",
          "otp_debug": "173823"
        }
      }
order: 1000
