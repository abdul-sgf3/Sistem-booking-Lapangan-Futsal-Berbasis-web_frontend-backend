<title>Kelola Booking - Vincent'SQ Sports Arena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--navy:#121C2F;--bg:#F6F7FB;--line:#cfd2d8;--mut:#7d818a;--green:#15803d;--red:#dc2626}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:#0f1626;display:flex;letter-spacing:-.2px}
button{font:inherit;cursor:pointer;color:inherit}
svg{flex:none}
aside{width:226px;background:#131b2e;color:#fff;position:relative;flex:none;height:100vh;position:sticky;top:0}
.logo{position:absolute;left:37px;top:22px;width:152px;height:50px;background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1b2a8a;font-style:italic;font-weight:700;font-size:17px;line-height:1}
.logo i{color:#d4202a;font-size:7px;letter-spacing:1.5px;font-style:normal;color:#222;margin-top:2px}
.pill{position:absolute;left:37px;top:97px;width:106px;height:28px;border-radius:14px;background:#3a4151;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500}
.menu-t{position:absolute;left:36px;top:150px;font-size:16px;font-weight:500}
nav a{position:absolute;left:37px;width:152px;display:flex;align-items:center;gap:8px;font-size:17px;color:#ccced0;text-decoration:none;height:32px;white-space:nowrap}
.logo{font-size:0}nav a{cursor:pointer}.ucard img{cursor:pointer}nav a.on{border-bottom:2px solid #fff;color:#f5f7fa}
.sdiv{position:absolute;left:20px;right:28px;bottom:120px;height:1px;background:#37404f}
.ucard{position:absolute;left:21px;bottom:17px;width:185px;height:54px;background:#f5f7fa;border-radius:14px;color:#0f1626;display:flex;align-items:center;padding:0 19px 0 17px;gap:11.5px}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.ucard b{display:block;font-weight:500;font-size:15px}.ucard small{font-size:11px}
.ucard .t{flex:1}
.main{flex:1;min-width:0}
header{height:99px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 38px 0 22px}
header h2{font-size:16px;font-weight:600}header p{color:var(--mut);font-size:15px;margin-top:4px;font-weight:400}
.dd{width:249px;height:59px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:9px;padding:0 17px 0 18px}
.dd .av{width:42px;height:42px;font-size:16px}.dd div{flex:1;font-size:16px;line-height:1.25;font-weight:500}.dd small{font-size:16px;font-weight:400;display:block}
.content{padding:26px 38px 30px 22px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top h1{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-1px;margin-top:0}
.top p{color:var(--mut);font-size:14px;margin-top:8px}
.btn{height:51px;padding:0 17px;border-radius:14px;background:var(--navy);color:#fff;border:0;display:flex;align-items:center;gap:8px;font-size:15px;margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:25px}
.stat{height:84px;border:1px solid #555d6b;border-radius:18px;background:#fff;display:flex;align-items:center;padding:0 25px;gap:14px}
.ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.stat span{display:block;color:var(--mut);font-size:16px}.row.h div:nth-child(4){padding-left:7px}.stat b{font-size:24px;font-weight:500;line-height:1.1;display:block;margin-top:3px}
.card{margin-top:31px;border:1px solid #555d6b;border-radius:18px;background:#fff;overflow:hidden}
.bar{height:68px;display:flex;align-items:center;padding:0 25px;gap:0;border-bottom:1px solid #8c919a}
.search{flex:1;height:34px;border-radius:17px;background:#eef0f4;display:flex;align-items:center;gap:8px;padding:0 16px;color:#8b8f98;margin-right:0}
.search input{border:0;background:none;outline:0;font:inherit;font-size:15px;flex:1;color:#0f1626}
.bar .cnt{color:#6b7079;font-size:16px;font-weight:500;width:175px;text-align:right}
.row{display:grid;grid-template-columns:264px 100px 184px 1fr auto;align-items:center;padding:0 25px;height:83px;border-top:1px solid #8c919a}
.row.h{height:60px;border-top:0;color:var(--mut);font-size:16px}
.row .c{text-align:center}.row .r{text-align:right}
.field{display:flex;align-items:center;gap:17px}
.th{width:72px;height:49px;border-radius:10px;flex:none;background-size:cover;background-position:center}
.field b{font-weight:500;font-size:16px;display:block}.field small{color:var(--mut);font-size:12px}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;font-size:12px;font-weight:500}
.vip{background:#e8b010;width:56px;height:24px;color:#2a2200}.reg{background:#dcdcde;width:76px;height:27px;color:#333}
.price{font-size:16px;font-weight:500}
.st{color:var(--green);font-size:14px;display:flex;align-items:center;gap:6px;font-weight:500}.st:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.st.p{color:#b45309}.st.p:before{background:#d97706}
.acts{margin-right:-8px;display:flex;gap:14px;justify-content:flex-end}
.ib{width:30px;height:30px;border:1px solid #666;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.ib.d{border-color:#999}
.foot{display:flex;justify-content:space-between;align-items:flex-start;padding:0 25px;height:23px;line-height:12px;font-size:12px;color:#6b7079}
.pg{display:flex;gap:6px;margin-top:-3px}.pg span{width:18px;height:18px;border:1px solid #cfd2d8;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}
.pg .a{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{padding:30px;text-align:center;color:var(--mut)}
nav a img{width:22px;height:22px;object-fit:contain}.logo img{width:100%;height:100%;object-fit:contain;padding:4px}.lo{width:22px;height:22px;object-fit:contain}
/* modal */
.ov{position:fixed;inset:0;background:rgba(17,28,46,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:12px;backdrop-filter:blur(.5px)}
.ov.on{display:flex}
.modal{width:480px;max-width:100%;max-height:96vh;overflow:auto;background:#fff;border:1px solid #888;border-radius:6px}
.mh{background:var(--bg);padding:35px 32px 29px;border-bottom:1px solid #8c919a}
.mh h3{font-size:19px;font-weight:600}.mh p{color:var(--mut);font-size:16px;margin-top:11px}
.mb{padding:0 32px 42px}
.mb label.l{display:block;font-size:17px;font-weight:500;margin:20px 0 8px}.mb label.l:first-child{margin-top:21px}.mb label.l:nth-of-type(3){margin:13px 0 15px}.mb label.l:nth-of-type(4){margin:19px 0 8px}.mb label.l:nth-of-type(5){margin:20px 0 13px}
.mb label.l i{color:#dc2626;font-style:normal}
.in{width:100%;height:56px;border:1px solid #666;border-radius:14px;padding:0 31px;font:inherit;font-size:18px;outline:0;color:#0f1626;background:#fff}
.in::placeholder{color:#8b8f98}.in.err{border-color:var(--red)}
.pre{position:relative}.pre .in{padding-left:20px}
.hint{color:#8b8f98;font-size:16px;margin-top:13px;line-height:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:43px}
.opt{height:62px;border:1px solid #666;border-radius:14px;display:flex;align-items:center;gap:16px;padding:0 22px 0 23px;cursor:pointer;background:#fff;text-align:left}
.opt .rd{width:28px;height:28px;border:2px solid #777;border-radius:50%;flex:none;position:relative}
.opt.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}.opt.on .rd{border-color:var(--navy)}.opt.on .rd:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--navy)}
.opt b{display:block;font-weight:500;font-size:16px;line-height:1.2}.opt span{font-size:16px;line-height:1.3}
.opt.err{border-color:var(--red)}
.tg{height:56px;border:1px solid #666;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 20px 0 20px;cursor:pointer;background:#fff;width:100%;text-align:left}
.sw{width:44px;height:26px;border-radius:13px;background:#777;position:relative;flex:none;transition:.15s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tg.on .sw{background:#16a34a}.tg.on .sw:after{left:21px}
.tg b{display:block;font-weight:500;font-size:17px;line-height:1.2}.tg small{color:#8b8f98;font-size:13px}
.drop{border:1.5px dashed #888;border-radius:18px;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:14px;color:#6b7079}
.drop.err{border-color:var(--red)}
.drop .ci{width:48px;height:48px;border:1px solid #bbb;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:5px}
.drop u{color:#2563eb;text-decoration:none}.drop small{font-size:12px;color:#8b8f98}
.cur{border:1px solid #666;border-radius:18px;height:118px;display:flex;align-items:center;padding:0 21px 0 31px;gap:15px}
.cur .p{width:86px;height:58px;border-radius:14px;background-size:cover;background-position:center;flex:none}
.cur .n{flex:1;min-width:0}.cur .n b{display:block;font-weight:500;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cur .n small{color:#8b8f98;font-size:14px;margin-left:2px}
.cur button{height:38px;padding:0 20px;border:1px solid #666;border-radius:10px;background:#fff;font-size:15px;font-weight:500}
.mf{display:grid;grid-template-columns:153px 1fr;gap:24px;margin-top:49px}
.b1,.b2{height:53px;border-radius:14px;font-size:17px;font-weight:500}
.b1{background:#fff;border:1px solid #666;color:#0f1626}.b2{background:var(--navy);color:#fff;border:0}
/* delete */
.dm{width:383px;max-width:100%;background:#fff;border:1px solid #848484;border-radius:18px;padding:38px 32px;text-align:center}
.dm .ci{width:60px;height:60px;border-radius:50%;background:#f3b7b7;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.dm h3{line-height:24px;font-size:19px;font-weight:600;letter-spacing:-.4px;color:#0a0a0a}.dm p{font-size:13px;line-height:15px;margin:16px 0 19px;letter-spacing:-.3px}
.dm .bt{display:flex;gap:9.5px;justify-content:center;padding-right:7px}
.dm button{width:79.5px;height:35px;padding:0;border-radius:8px;font-size:15px;font-weight:600;letter-spacing:-.3px}
.dm .x{background:#fff;border:1px solid #888}.dm .y{background:#dc2626;color:#fff;border:0}
@media(max-width:900px){aside{display:none}.stats{gap:12px}.top h1{font-size:26px}.row{grid-template-columns:2.5fr 1fr 1.3fr 1.2fr 1fr;padding:0 12px}.row .field{gap:8px}.th{width:44px;height:32px}.bar{padding:0 12px}.search{margin-right:12px}.stat{padding:0 12px}.stat span{font-size:12px}.ic{display:none}}
</style>
</head>
