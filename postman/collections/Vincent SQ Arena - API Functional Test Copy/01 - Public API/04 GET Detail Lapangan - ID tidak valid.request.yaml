$kind: http-request
url: "{{baseUrl}}/public/lapangan_detail.php?id=0"
method: GET
queryParams:
  id: "0"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP status = 400', function () { pm.response.to.have.status(400); });
      pm.test('Response header Content-Type JSON', function () { pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'); });
      let j = {}; try { j = pm.response.json(); } catch(e) { pm.expect.fail('Response bukan JSON valid: ' + e.message); }
      pm.test('Response memiliki struktur JSON standar', function () { pm.expect(j).to.be.an('object'); pm.expect(j).to.have.property('status'); pm.expect(j).to.have.property('message'); });
      pm.test('Status response error', function () { pm.expect(j.status).to.eql('error'); pm.expect(j).to.have.property('message'); });
    language: text/javascript
examples: .resources/04 GET Detail Lapangan - ID tidak valid.resources/examples
order: 4000
