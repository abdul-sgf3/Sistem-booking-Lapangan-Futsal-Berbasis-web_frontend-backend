<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Email - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --vsq-navy: #2C437B; 
            --vsq-blue: #477FEB; 
            --vsq-red: #FF0000; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        
        /* 1. BACKGROUND GELAP (Gambar Lapangan) */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; 
            background: linear-gradient(rgba(19, 27, 46, 0.7), rgba(19, 27, 46, 0.7)), 
                        url('assets/uploads/lapangan/hero.jpeg') center/cover no-repeat fixed;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        /* Tombol Kembali (Putih) */
        .vsq-back-btn { 
            position: absolute; 
            top: 40px; 
            left: 40px; 
            color: #FFFFFF; 
            text-decoration: none; 
            z-index: 10;
        }
        .vsq-back-btn svg { 
            width: 32px; 
            height: 32px; 
            stroke: #FFFFFF; 
            stroke-width: 2.5; 
            fill: none; 
        }

        /* 2. CARD PUTIH DI TENGAH (Bukan split screen) */
        .vsq-verify-card { 
            background: #FFFFFF; 
            width: 100%; 
            max-width: 420px; 
            border-radius: 16px; 
            padding: 40px 35px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.3); 
            text-align: center;
        }

        /* Logo */
        .vsq-logo { margin-bottom: 24px; }
        .vsq-logo h1 { 
            font-size: 28px; 
            font-weight: 800; 
            color: var(--vsq-navy); 
            margin: 0; 
        }
        .vsq-logo p { 
            font-size: 14px; 
            font-weight: 800; 
            color: var(--vsq-red); 
            letter-spacing: 1.5px; 
            margin-top: 4px; 
        }

        /* Ilustrasi Kurir */
        .vsq-illustration img {
            width: 150px;
            height: auto;
            margin-bottom: 24px;
        }

        /* Teks Verifikasi */
        .vsq-text { 
            font-size: 14px; 
            color: #333; 
            line-height: 1.5; 
            margin-bottom: 24px; 
        }
        .vsq-text strong { 
            color: var(--vsq-navy); 
            font-weight: 700; 
            display: block; 
            margin-top: 4px; 
            font-size: 15px; 
        }

        /* 3. KOTAK OTP (5 Kotak, Border Abu-abu) */
        .vsq-otp-container { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 24px; 
        }
        .vsq-otp-input { 
            width: 50px; 
            height: 60px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: 600; 
            color: #333; 
            border: 1px solid #D1D5DB; /* Border abu-abu tipis */
            border-radius: 8px; 
            outline: none; 
            transition: all 0.2s;
            background: #FFFFFF;
        }
        .vsq-otp-input:focus { 
            border-color: var(--vsq-blue); 
            box-shadow: 0 0 0 3px rgba(71, 127, 235, 0.15); 
        }

        /* Timer */
        .vsq-timer-text { 
            font-size: 13px; 
            color: #4B5563; 
            margin-bottom: 24px; 
        }
        .vsq-timer-text span { 
            color: var(--vsq-blue); 
            font-weight: 600; 
        }

        /* Tombol Verifikasi (Biru) */
        .vsq-btn { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            font-size: 15px; 
            font-weight: 600; 
            color: #FFFFFF; 
            background-color: var(--vsq-blue); 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .vsq-btn:hover { 
            background-color: #3564C6; 
        }
    </style>
</head>
<body>

    <!-- Tombol Kembali -->
    <a href="register.html" class="vsq-back-btn">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>

    <!-- Card Verifikasi -->
    <div class="vsq-verify-card">
        
        <!-- Logo -->
        <div class="vsq-logo">
            <h1>Vincent'SQ</h1>
            <p>SPORTS ARENA</p>
        </div>

        <!-- Ilustrasi Kurir -->
        <div class="vsq-illustration">
            <img src="assets/images/ilustrasi-kurir.jpg" alt="Ilustrasi Kurir" onerror="this.src='https://illustrations.popsy.co/blue/forgot-password.svg'">
        </div>

        <!-- Teks -->
        <div class="vsq-text">
            Kami telah mengirimkan kode verifikasi ke
            <strong id="email-target">email@anda.com</strong>
        </div>

        <!-- Form OTP -->
        <form id="otpForm">
            <!-- 5 Kotak OTP -->
            <div class="vsq-otp-container">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 1)" autofocus>
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 2)">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 3)">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 4)">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 5)">
            </div>

            <div class="vsq-timer-text">Kode akan kadaluwarsa dalam <span id="timer">01:32</span></div>

            <button type="submit" class="vsq-btn">Verifikasi</button>
        </form>

    </div>

    <script>
        // 1. Tampilkan Email dari halaman Register
        const savedEmail = localStorage.getItem('register_email');
        if(savedEmail) {
            document.getElementById('email-target').textContent = savedEmail;
        } else {
            window.location.href = 'register.html';
        }

        // 2. Auto-focus antar kotak OTP
        function moveFocus(current, nextIndex) {
            if (current.value.length === 1) {
                const inputs = document.querySelectorAll('.vsq-otp-input');
                if (nextIndex < inputs.length) {
                    inputs[nextIndex].focus();
                }
            }
        }

        // 3. Timer Hitung Mundur
        let timeLeft = 92;
        const timerEl = document.getElementById('timer');
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerEl.textContent = "00:00";
                return;
            }
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }, 1000);

        // 4. Proses Submit
        document.getElementById('otpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Ambil semua angka OTP
            const inputs = document.querySelectorAll('.vsq-otp-input');
            let code = '';
            inputs.forEach(input => code += input.value);
            
            // Validasi: Pastikan 5 kotak terisi
            if (code.length < 5) {
                alert("Mohon isi semua 5 kotak kode verifikasi!");
                return;
            }

            // BYPASS: Apapun kodenya, langsung ke halaman lengkapi profil
            window.location.href = 'lengkapi_profil.html';
        });
    </script>
</body>
</html>
