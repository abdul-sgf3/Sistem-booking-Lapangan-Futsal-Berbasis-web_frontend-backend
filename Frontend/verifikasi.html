<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Email - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --vsq-navy: #131B2E; --vsq-red: #FF0000; --vsq-gray-text: #848484; --vsq-gray-border: #CBD5E1;
            --vsq-dark-btn: #131B2E; --vsq-error: #FF5555; --vsq-blue-focus: #477FEB;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; 
            background: linear-gradient(rgba(19, 27, 46, 0.7), rgba(19, 27, 46, 0.7)), url('assets/uploads/lapangan/hero.jpeg') center/cover no-repeat fixed;
            display: flex; align-items: center; justify-content: center; padding: 20px; 
        }

        .vsq-back-btn { position: absolute; top: 36px; left: 38px; color: #FFFFFF; text-decoration: none; z-index: 10; }
        .vsq-back-btn svg { width: 40px; height: 40px; stroke: #FFFFFF; stroke-width: 2.5; fill: none; }

        .vsq-verify-card { 
            background: #FFFFFF; width: 100%; max-width: 460px; border-radius: 20px; padding: 40px 41px 50px 41px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid #848484;
            text-align: center; display: flex; flex-direction: column; align-items: center; position: relative;
        }

        .vsq-logo { margin-bottom: 25px; }
        .vsq-logo h1 { font-size: 31px; font-weight: 700; color: var(--vsq-navy); margin: 0; letter-spacing: -0.45px; }
        .vsq-logo p { font-size: 18px; font-weight: 700; color: var(--vsq-red); letter-spacing: 0.6px; margin-top: 4px; text-transform: uppercase; }

        .vsq-illustration { width: 160px; height: auto; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .vsq-illustration img { width: 100%; height: auto; object-fit: contain; }

        .vsq-text { font-size: 14px; color: #000000; line-height: 1.5; margin-bottom: 25px; }
        .vsq-text strong { color: #000000; font-weight: 700; display: block; margin-top: 5px; font-size: 15px; }

        .vsq-otp-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; width: 100%; }
        .vsq-otp-input { 
            width: 46px; height: 56px; text-align: center; font-size: 24px; font-weight: 500; color: #000000; 
            border: 1px solid var(--vsq-gray-border); border-radius: 8px; outline: none; background: #FFFFFF; transition: all 0.2s;
        }
        .vsq-otp-input:focus { border-color: var(--vsq-blue-focus); }
        .vsq-otp-input.is-invalid { border-color: var(--vsq-error) !important; }
        
        .vsq-error-msg { display: none; color: var(--vsq-error); font-size: 12px; font-weight: 500; margin-bottom: 15px; align-items: center; justify-content: center; gap: 5px; }
        .vsq-error-msg.show { display: flex; }
        .vsq-error-icon svg { width: 14px; height: 14px; stroke: var(--vsq-error); fill: none; stroke-width: 2; }

        .vsq-timer-text { font-size: 14px; color: #000000; margin-bottom: 8px; }
        .vsq-timer-text span { color: var(--vsq-blue-focus); font-weight: 500; }
        
        .vsq-change-email { font-size: 14px; color: #000000; margin-bottom: 25px; }
        .vsq-change-email a { color: var(--vsq-blue-focus); text-decoration: none; font-weight: 500; }

        .vsq-btn { background: var(--vsq-dark-btn); color: #FFFFFF; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .vsq-btn:hover { opacity: 0.9; }
        .vsq-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>

    <a href="register.html" class="vsq-back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>

    <div class="vsq-verify-card">
        <div class="vsq-logo"><h1>Vincent'SQ</h1><p>SPORTS ARENA</p></div>

        <div class="vsq-illustration">
            <img src="assets/images/ilustrasi-kurir.png" alt="Ilustrasi Kurir">
        </div>

        <div class="vsq-text">Kami telah mengirimkan kode verifikasi ke <strong id="email-target">email@anda.com</strong></div>

        <form id="otpForm" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            
            <div class="vsq-otp-container">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 1)" autofocus inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 2)" inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 3)" inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 4)" inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 5)" inputmode="numeric" pattern="[0-9]*">
                <input type="text" maxlength="1" class="vsq-otp-input" oninput="moveFocus(this, 6)" inputmode="numeric" pattern="[0-9]*">
            </div>

            <div class="vsq-error-msg" id="err-otp">
                <span class="vsq-error-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></span>
                <span id="err-otp-text">Kode OTP belum dimasukan!</span>
            </div>

            <div class="vsq-timer-text">Kirim ulang kode dalam <span id="timer">01:00</span></div>
            <div class="vsq-change-email">Salah Email? <a href="register.html">Ganti email</a></div>

            <button type="submit" class="vsq-btn" id="btnVerifikasi">Verifikasi</button>
        </form>
    </div>

    <script>
        // URL API (Tetap dibiarkan, untuk digunakan nanti jika BE sudah fix)
        const API_BASE = 'https://sistem-booking-lapangan-futsal-berbasis-webfron-production.up.railway.app/API';
        
        const savedEmail = localStorage.getItem('register_email');
        if(savedEmail) { document.getElementById('email-target').textContent = savedEmail; } 
        else { window.location.href = 'register.html'; }

        function moveFocus(current, nextIndex) {
            if (current.value.length === 1) {
                const inputs = document.querySelectorAll('.vsq-otp-input');
                if (nextIndex < inputs.length) inputs[nextIndex].focus();
            }
        }

        document.querySelectorAll('.vsq-otp-input').forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    document.querySelectorAll('.vsq-otp-input')[index - 1].focus();
                }
            });
            input.addEventListener('input', () => {
                document.querySelectorAll('.vsq-otp-input').forEach(el => el.classList.remove('is-invalid'));
                document.getElementById('err-otp').classList.remove('show');
            });
        });

        let timeLeft = 60; 
        const timerEl = document.getElementById('timer');
        const countdown = setInterval(() => {
            if (timeLeft <= 0) { clearInterval(countdown); timerEl.textContent = "00:00"; return; }
            timeLeft--;
            timerEl.textContent = `${Math.floor(timeLeft / 60).toString().padStart(2, '0')}:${(timeLeft % 60).toString().padStart(2, '0')}`;
        }, 1000);

        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const inputs = document.querySelectorAll('.vsq-otp-input');
            let code6Digit = '';
            inputs.forEach(input => code6Digit += input.value);
            
            const errOtp = document.getElementById('err-otp');
            const errOtpText = document.getElementById('err-otp-text');

            if (code6Digit.length < 6) {
                inputs.forEach(input => { if(input.value === '') input.classList.add('is-invalid'); });
                errOtpText.textContent = "Kode OTP belum dimasukan!";
                errOtp.classList.add('show');
                return;
            }

            const btn = document.getElementById('btnVerifikasi');
            btn.disabled = true; btn.textContent = 'Memverifikasi...';

            // =====================================================================
            // SOLUSI SEMENTARA (MOCKING UNTUK QA) KARENA BE BELUM BISA DIAKSES
            // =====================================================================
            setTimeout(() => {
                // Simulasi berhasil, langsung pindah ke halaman lengkapi profil
                window.location.href = 'lengkapi_profil.html';
            }, 1000);

            /* 
            // --- KODE ASLI (Buka blok komentar ini jika Backend sudah diperbaiki) ---
            try {
                const response = await fetch(API_BASE + '/auth/verify_otp.php', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', 
                    body: JSON.stringify({ email: savedEmail, otp: code6Digit })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    window.location.href = 'lengkapi_profil.html';
                } else {
                    inputs.forEach(input => input.classList.add('is-invalid'));
                    errOtpText.textContent = result.message;
                    errOtp.classList.add('show');
                    btn.disabled = false; btn.textContent = 'Verifikasi';
                }
            } catch (error) {
                alert('Gagal Terhubung: ' + error.message); 
                btn.disabled = false; btn.textContent = 'Verifikasi';
            }
            */
        });
    </script>
</body>
</html>
