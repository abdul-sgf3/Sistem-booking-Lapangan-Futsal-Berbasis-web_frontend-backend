<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vincent SQ Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/network.css">
</head>
<body>

<div class="auth-wrapper">
    
    <div class="auth-left">
        <div class="auth-card">
            
            <div class="auth-logo">
                <h1>Vincent'SQ</h1>
                <p>Sports Arena</p>
            </div>

            <div class="auth-welcome">Selamat Datang kembali!</div>

            <div id="alert-box"></div>

            <form id="login-form">
                <div class="auth-form-group">
                    <label for="email">Email<span>*</span></label>
                    <input type="email" id="email" name="email" class="auth-input" placeholder="Masukkan email..." required>
                </div>

                <div class="auth-form-group">
                    <label for="password">Password<span>*</span></label>
                    <input type="password" id="password" name="password" class="auth-input" placeholder="Masukkan Password..." required>
                </div>

                <button type="submit" class="auth-btn">Masuk</button>
            </form>

            <div class="auth-link">
                Belum mempunyai akun? <a href="register.html">Daftar sekarang</a>
            </div>

        </div>
    </div>

    <div class="auth-right"></div>

</div>

<!-- Network Detection -->
<div id="network-overlay" class="network-overlay">
    <div class="network-content">
        <h2 class="network-title">Tidak Ada Koneksi Internet</h2>
        <p class="network-message">Periksa koneksi Anda dan coba lagi</p>
        <button onclick="retryConnection()" class="network-btn">Coba Lagi</button>
    </div>
</div>
<div id="toast-container" class="toast-container"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/network.js"></script>

</body>
</html>
