<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Password Baru - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --vsq-navy: #2C437B; --vsq-blue: #477FEB; --vsq-red: #FF0000; --vsq-gray: #D1D5DB; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; margin: 0; padding: 0; }
        .vsq-wrapper { display: flex; min-height: 100vh; width: 100%; }

        /* Kiri: Form Putih */
        .vsq-left { flex: 1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 40px 30px; position: relative; }
        .vsq-back-btn { position: absolute; top: 40px; left: 40px; color: #000; text-decoration: none; }
        .vsq-back-btn svg { width: 32px; height: 32px; stroke: #000; stroke-width: 2.5; fill: none; }

        .vsq-card { width: 100%; max-width: 400px; text-align: center; }
        
        .vsq-logo { margin-bottom: 20px; }
        .vsq-logo h1 { font-size: 28px; font-weight: 800; color: var(--vsq-navy); margin: 0; }
        .vsq-logo p { font-size: 14px; font-weight: 800; color: var(--vsq-red); letter-spacing: 1.5px; margin-top: 4px; }

        /* Ilustrasi Password Baru */
        .vsq-illustration { margin-bottom: 20px; }
        .vsq-illustration img { 
            width: 160px; 
            height: auto; 
            /* Pastikan nama file gambar sesuai dengan yang Anda simpan */
            /* Ganti .png menjadi .jpg jika format aslinya JPG */
        }

        /* Form Group */
        .vsq-form-group { margin-bottom: 16px; text-align: left; }
        .vsq-form-group label { display: block; font-size: 12px; font-weight: 500; color: #000; margin-bottom: 6px; }
        .vsq-form-group label span { color: var(--vsq-red); }
        
        .vsq-input-wrapper { position: relative; width: 100%; }
        .vsq-form-control { width: 100%; padding: 12px 16px; padding-right: 45px; font-size: 14px; background-color: #FFFFFF; border: 1px solid var(--vsq-gray); border-radius: 8px; outline: none; transition: all 0.2s; }
        .vsq-form-control:focus { border-color: var(--vsq-blue); }
        
        /* Ikon Mata */
        .vsq-toggle-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748B; background: transparent; border: none; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .vsq-toggle-password svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        /* Tombol */
        .vsq-btn { display: block; width: 100%; padding: 12px 20px; font-size: 14px; font-weight: 600; color: #FFFFFF; background-color: var(--vsq-blue); border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 20px; }
        .vsq-btn:hover { background-color: #3564C6; }

        /* Kanan: Gambar Lapangan */
        .vsq-right { flex: 1; background: linear-gradient(rgba(19, 27, 46, 0.7), rgba(19, 27, 46, 0.7)), url('assets/uploads/lapangan/hero.jpeg') center/cover no-repeat; }

        @media (max-width: 900px) { .vsq-wrapper { flex-direction: column; } .vsq-left { padding: 40px 20px; } .vsq-right { min-height: 200px; order: -1; } }
    </style>
</head>
<body>
    <div class="vsq-wrapper">
        <div class="vsq-left">
            <a href="verifikasi_lupa.html" class="vsq-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
            
            <div class="vsq-card">
                <div class="vsq-logo">
                    <h1>Vincent'SQ</h1>
                    <p>SPORTS ARENA</p>
                </div>
                
                <div class="vsq-illustration">
                    <!-- GANTI NAMA FILE GAMBAR DI BAWAH INI SESUAI YANG ANDA SIMPAN -->
                    <img src="assets/images/ilustrasi_password_baru.png" alt="Ilustrasi Password Baru" onerror="this.src='https://illustrations.popsy.co/blue/security.svg'">
                </div>

                <form id="formPasswordBaru">
                    <div class="vsq-form-group">
                        <label>Password Baru<span>*</span></label>
                        <div class="vsq-input-wrapper">
                            <input type="password" id="passwordBaru" class="vsq-form-control" placeholder="••••••••" required>
                            <button type="button" class="vsq-toggle-password" onclick="togglePassword('passwordBaru', this)">
                                <svg viewBox="0 0 24 24" class="icon-eye-closed"><path d="M3 10 Q12 18 21 10" /><line x1="3" y1="10" x2="2" y2="13" /><line x1="7" y1="13" x2="5.5" y2="16" /><line x1="12" y1="15" x2="12" y2="18" /><line x1="17" y1="13" x2="18.5" y2="16" /><line x1="21" y1="10" x2="22" y2="13" /></svg>
                                <svg viewBox="0 0 24 24" class="icon-eye-open" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <div class="vsq-form-group">
                        <label>Konfirmasi Password<span>*</span></label>
                        <div class="vsq-input-wrapper">
                            <input type="password" id="konfirmasiBaru" class="vsq-form-control" placeholder="••••••••" required>
                            <button type="button" class="vsq-toggle-password" onclick="togglePassword('konfirmasiBaru', this)">
                                <svg viewBox="0 0 24 24" class="icon-eye-closed"><path d="M3 10 Q12 18 21 10" /><line x1="3" y1="10" x2="2" y2="13" /><line x1="7" y1="13" x2="5.5" y2="16" /><line x1="12" y1="15" x2="12" y2="18" /><line x1="17" y1="13" x2="18.5" y2="16" /><line x1="21" y1="10" x2="22" y2="13" /></svg>
                                <svg viewBox="0 0 24 24" class="icon-eye-open" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="vsq-btn">Konfirmasi</button>
                </form>
            </div>
        </div>
        <div class="vsq-right"></div>
    </div>

    <script>
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            const iconClosed = iconElement.querySelector('.icon-eye-closed');
            const iconOpen = iconElement.querySelector('.icon-eye-open');
            if (input.type === 'password') { input.type = 'text'; iconClosed.style.display = 'none'; iconOpen.style.display = 'block'; } 
            else { input.type = 'password'; iconClosed.style.display = 'block'; iconOpen.style.display = 'none'; }
        }

        document.getElementById('formPasswordBaru').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('passwordBaru').value;
            const confirm = document.getElementById('konfirmasiBaru').value;

            if (pass !== confirm) {
                alert("Password dan Konfirmasi tidak cocok!");
                return;
            }
            if (pass.length < 6) {
                alert("Password minimal 6 karakter!");
                return;
            }
            
            // Simulasi Berhasil -> Login
            alert("Password berhasil diubah! Silakan login kembali.");
            localStorage.removeItem('reset_email');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
