<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f7f9fc;
        }

        /* Bagian Kiri (Form Login) */
        .login-section {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            background-color: #f7f9fc;
        }

        .back-arrow {
            position: absolute;
            top: 40px;
            left: 50px;
            font-size: 28px;
            color: #1e293b;
            text-decoration: none;
            font-weight: 300;
        }

        .login-box {
            width: 100%;
            max-width: 450px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 220px;
        }

        .admin-badge {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .admin-badge span {
            background-color: #0f172a;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 20px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            color: #0f172a;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
            color: #334155;
        }

        .form-group input:focus {
            border-color: #3b82f6;
        }

        /* Styling Captcha Custom */
        .captcha-container {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            background-color: #ffffff;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .captcha-container.error {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .captcha-checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            margin-right: 15px;
            position: relative;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .captcha-container.error .captcha-checkbox {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .captcha-text {
            font-size: 15px;
            color: #334155;
        }

        .captcha-brand {
            margin-left: auto;
            text-align: center;
        }

        .captcha-brand img {
            height: 30px;
            display: block;
            margin: 0 auto;
        }

        .captcha-brand span {
            font-size: 10px;
            color: #64748b;
            display: block;
            margin-top: 2px;
        }

        /* Animasi Loading & Ikon Centang */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #e2e8f0;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .check-icon {
            display: none;
            color: #10b981;
            font-size: 20px;
            font-weight: bold;
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1e293b;
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* Bagian Kanan (Gambar Background) */
        .image-section {
            width: 50%;
            background-image: url('assets/images/bg-login.jpg');
            background-size: cover;
            background-position: center;
        }

        @media (max-width: 768px) {
            .login-section { width: 100%; }
            .image-section { display: none; }
        }
    </style>
</head>
<body>

    <div class="login-section">
        <a href="index.html" class="back-arrow">&#8592;</a>
        
        <div class="login-box">
            <div class="logo-container">
                <img src="assets/images/logo.png" alt="Vincent SQ Logo">
            </div>

            <div class="admin-badge">
                <span>Admin</span>
            </div>
            
            <h1>Masuk ke Panel Admin</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email*</label>
                    <input type="email" id="email" placeholder="Masukkan email admin" required>
                </div>

                <div class="form-group">
                    <label for="password">Password*</label>
                    <input type="password" id="password" placeholder="Masukkan password" required>
                </div>

                <!-- KOTAK CAPTCHA -->
                <div class="captcha-container" id="captchaContainer">
                    <div class="captcha-checkbox" id="captchaCheckbox">
                        <div class="spinner" id="captchaSpinner"></div>
                        <div class="check-icon" id="captchaCheckIcon">&#10003;</div>
                    </div>
                    <span class="captcha-text">I'm not a robot</span>
                    <div class="captcha-brand">
                        <img src="assets/images/recaptcha.png" alt="reCAPTCHA">
                        <span>reCAPTCHA</span>
                    </div>
                </div>
                
                <div class="error-message" id="captchaError">
                    <span>&#9432;</span> Verifikasi gagal. Silakan centang lagi.
                </div>

                <button type="submit" class="btn-submit" id="btnLogin">Masuk</button>
            </form>
        </div>
    </div>

    <!-- Bagian Gambar Kanan -->
    <div class="image-section"></div>

    <script>
        // =========================================================================
        // MODE: BYPASS CAPTCHA + LOGIN DEMO (untuk Live Server / preview desain)
        // =========================================================================
        // Catatan:
        // - Captcha di bawah TIDAK memanggil API BE, hanya simulasi centang biru.
        // - Login di bawah juga tidak memanggil API BE; hanya validasi demo.
        // - Untuk koneksi sungguhan ke BE, ganti blok "MODE BYPASS" di bawah
        //   dengan fetch ke `${API_BASE_URL}/captcha.php` dan `${API_BASE_URL}/login.php`
        //   (lihat penjelasan setelah kode).
        // =========================================================================

        const captchaContainer = document.getElementById('captchaContainer');
        const captchaSpinner = document.getElementById('captchaSpinner');
        const captchaCheckIcon = document.getElementById('captchaCheckIcon');
        const captchaError = document.getElementById('captchaError');

        let isCaptchaVerified = false;

        captchaContainer.addEventListener('click', function() {
            if (isCaptchaVerified) return;

            // Tampilkan animasi loading
            captchaSpinner.style.display = 'block';
            captchaCheckIcon.style.display = 'none';
            captchaError.style.display = 'none';
            captchaContainer.classList.remove('error');
            captchaContainer.style.borderColor = '#cbd5e1';

            // Simulasi loading 0.8 detik, lalu centang biru (tanpa panggil API)
            setTimeout(() => {
                isCaptchaVerified = true;
                captchaSpinner.style.display = 'none';
                captchaCheckIcon.style.display = 'block';
                captchaContainer.style.borderColor = '#10b981'; // hijau
            }, 800);
        });

        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!isCaptchaVerified) {
                alert("Silakan centang 'I'm not a robot' terlebih dahulu!");
                return;
            }

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Validasi demo FE (bukan validasi BE)
            if (email === 'admin@vincent.com' && password === 'Admin12345') {
                btnLogin.disabled = true;
                btnLogin.innerText = "Memproses...";

                setTimeout(() => {
                    alert("Login Berhasil! Selamat datang Admin.");
                    window.location.href = 'admin_kelola_lapangan.html';
                }, 1000);
            } else {
                alert("Login Gagal! (Mode Demo FE).\nGunakan email: admin@vincent.com\nPassword: Admin12345");
            }
        });
    </script>
</body>
</html>
