<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --vsq-navy: #131B2E; --vsq-blue: #477FEB; --vsq-red: #FF0000; --vsq-gray: #848484; --vsq-error: #FF5555; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; margin: 0; padding: 0; }

        .vsq-wrapper { display: flex; min-height: 100vh; width: 100%; }
        .vsq-left { flex: 1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 40px 30px; position: relative; }
        .vsq-back-btn { position: absolute; top: 40px; left: 40px; color: #000; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .vsq-back-btn:hover { transform: translateX(-4px); }
        .vsq-back-btn svg { width: 32px; height: 32px; stroke: #000; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .vsq-card { width: 100%; max-width: 380px; text-align: center; }
        
        .vsq-logo { margin-bottom: 24px; }
        .vsq-logo h1 { font-size: 38px; font-weight: 800; color: var(--vsq-navy); margin: 0; letter-spacing: -0.5px; line-height: 1.2; }
        .vsq-logo p { font-size: 22px; font-weight: 800; color: var(--vsq-red); letter-spacing: 0.6px; margin-top: 4px; text-transform: uppercase; line-height: 1.1; }
        
        .vsq-title { font-size: 18px; font-weight: 700; color: #000; margin: 20px 0 8px 0; }
        .vsq-subtitle { font-size: 14px; color: #4B5563; margin-bottom: 24px; line-height: 1.5; }

        .vsq-illustration { margin-bottom: 30px; display: flex; justify-content: center; }
        .vsq-illustration img { width: 200px; height: auto; object-fit: contain; }

        .vsq-form-group { margin-bottom: 20px; text-align: left; position: relative; }
        .vsq-form-group label { display: block; font-size: 13px; font-weight: 500; color: #000; margin-bottom: 6px; }
        .vsq-form-group label span { color: #000; }
        
        .vsq-form-control { 
            width: 100%; height: 48px; padding: 10px 16px; font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #FFFFFF; border: 1px solid var(--vsq-gray); border-radius: 10px; outline: none; transition: all 0.2s; color: #000;
        }
        .vsq-form-control:focus { border-color: var(--vsq-navy); }
        .vsq-form-control.is-invalid { border: 1px solid var(--vsq-error) !important; }

        .vsq-form-control:-webkit-autofill,
        .vsq-form-control:-webkit-autofill:hover, 
        .vsq-form-control:-webkit-autofill:focus, 
        .vsq-form-control:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            box-shadow: 0 0 0 30px white inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .vsq-error-msg { display: none; align-items: flex-start; gap: 6px; font-size: 12px; color: var(--vsq-error); margin-top: 6px; font-weight: 500; }
        .vsq-error-msg.show { display: flex; }
        .vsq-error-icon { width: 14px; height: 14px; background: transparent; border: 2px solid var(--vsq-error); color: var(--vsq-error); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; flex-shrink: 0; margin-top: 1px; }

        .vsq-btn { display: block; width: 100%; height: 48px; padding: 0 20px; font-size: 15px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; color: #FFFFFF; background-color: var(--vsq-navy); border: none; border-radius: 12px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .vsq-btn:hover { background-color: #0a0e1a; }

        .vsq-right { flex: 1; background: linear-gradient(rgba(19, 27, 46, 0.6), rgba(19, 27, 46, 0.6)), url('assets/uploads/lapangan/Lapangan2.jpeg') center/cover no-repeat; border-left: 1px solid #000; }

        /* NETWORK OVERLAY */
        .network-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1A2235; z-index: 99999; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s ease; }
        .network-content { text-align: center; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .network-icon svg { width: 120px; height: 120px; stroke: #FF3B30; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 30px; }
        .network-title { color: #FFFFFF; font-size: 32px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; }
        .network-message { color: #A0ABC0; font-size: 18px; margin-bottom: 30px; font-weight: 500; }
        .network-btn { background-color: #FF3B30; color: #FFFFFF; border: none; padding: 14px 40px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: background 0.2s ease, transform 0.2s ease; font-family: 'Plus Jakarta Sans', sans-serif; }
        .network-btn:hover { background-color: #E03127; transform: translateY(-2px); }

        @media (max-width: 900px) { 
            .vsq-wrapper { flex-direction: column; } 
            .vsq-left { padding: 80px 20px 40px; } 
            .vsq-right { min-height: 200px; order: -1; border-left: none; border-bottom: 1px solid #000; } 
            .vsq-back-btn { top: 20px; left: 20px; }
            .network-icon svg { width: 80px; height: 80px; margin-bottom: 20px; }
            .network-title { font-size: 24px; }
            .network-message { font-size: 15px; }
            .network-btn { padding: 12px 32px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="vsq-wrapper">
        <div class="vsq-left">
            <a href="login.html" class="vsq-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
            
            <div class="vsq-card">
                <div class="vsq-logo"><h1>Vincent'SQ</h1><p>SPORTS ARENA</p></div>
                
                <div class="vsq-title">Lupa Password?</div>
                <div class="vsq-subtitle">Jangan khawatir, kami akan membantumu mereset password</div>
                
                <div class="vsq-illustration">
                    <img src="assets/images/icon-lupa-password.png" alt="Ilustrasi Lupa Password" onerror="this.src='https://illustrations.popsy.co/blue/delivery.svg'">
                </div>
                
                <form id="formLupa" novalidate>
                    <div class="vsq-form-group">
                        <label for="email">Email<span>*</span></label>
                        <input type="email" id="email" class="vsq-form-control" placeholder="Masukkan email...">
                        
                        <div class="vsq-error-msg" id="err-email-kosong"><span class="vsq-error-icon">!</span> Email tidak boleh kosong</div>
                        <div class="vsq-error-msg" id="err-email-spasi"><span class="vsq-error-icon">!</span> Email tidak boleh mengandung spasi!</div>
                        <div class="vsq-error-msg" id="err-email-format"><span class="vsq-error-icon">!</span> Email Harus mengandung karakter @ dan .</div>
                        <div class="vsq-error-msg" id="err-email-notfound"><span class="vsq-error-icon">!</span> Email belum terdaftar!</div>
                    </div>
                    <button type="submit" class="vsq-btn" id="btnLanjut">Melanjutkan</button>
                </form>
            </div>
        </div>
        <div class="vsq-right"></div>
    </div>

    <!-- NETWORK OVERLAY HTML -->
    <div id="network-overlay" class="network-overlay" style="display: none; opacity: 0;">
        <div class="network-content">
            <div class="network-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M1 1l22 22"/>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                    <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                    <line x1="12" y1="20" x2="12.01" y2="20"/>
                </svg>
            </div>
            <h2 class="network-title">Tidak Ada Koneksi Internet</h2>
            <p class="network-message">Periksa Koneksi Anda Kembali</p>
            <button onclick="retryConnection()" class="network-btn">Coba Lagi</button>
        </div>
    </div>

    <script>
        // ===== LOGIKA NETWORK OVERLAY =====
        function showNetworkOverlay() { 
            const overlay = document.getElementById('network-overlay'); 
            if (!overlay) return; 
            overlay.style.display = 'flex'; 
            void overlay.offsetWidth; 
            overlay.style.opacity = '1'; 
        }
        
        function hideNetworkOverlay() { 
            const overlay = document.getElementById('network-overlay'); 
            if (!overlay) return; 
            overlay.style.opacity = '0'; 
            setTimeout(() => { overlay.style.display = 'none'; }, 300); 
        }
        
        window.addEventListener('offline', () => { showNetworkOverlay(); });
        window.addEventListener('online', () => { hideNetworkOverlay(); });
        window.addEventListener('load', () => { if (!navigator.onLine) showNetworkOverlay(); });
        
        function retryConnection() { 
            if (navigator.onLine) { 
                hideNetworkOverlay(); 
            } else { 
                showNetworkOverlay();
            } 
        }

        // ===== LOGIKA FORM LUPA PASSWORD =====
        const emailInput = document.getElementById('email');
        const formLupa = document.getElementById('formLupa');
        const btnLanjut = document.getElementById('btnLanjut');
        
        const errKosong = document.getElementById('err-email-kosong');
        const errSpasi = document.getElementById('err-email-spasi');
        const errFormat = document.getElementById('err-email-format');
        const errNotFound = document.getElementById('err-email-notfound');

        function resetErrors() {
            emailInput.classList.remove('is-invalid');
            errKosong.classList.remove('show');
            errSpasi.classList.remove('show');
            errFormat.classList.remove('show');
            errNotFound.classList.remove('show');
        }

        function validateEmail() {
            const val = emailInput.value;
            resetErrors();

            if (val.trim() === '') {
                emailInput.classList.add('is-invalid'); errKosong.classList.add('show'); return false;
            }
            if (val.includes(' ')) {
                emailInput.classList.add('is-invalid'); errSpasi.classList.add('show'); return false;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(val)) {
                emailInput.classList.add('is-invalid'); errFormat.classList.add('show'); return false;
            }
            return true;
        }

        emailInput.addEventListener('input', validateEmail);

        formLupa.addEventListener('submit', function(e) {
            e.preventDefault();
            if (!validateEmail()) return;

            btnLanjut.disabled = true; btnLanjut.textContent = 'Memproses...';
            localStorage.setItem('reset_email', emailInput.value);
            setTimeout(() => { window.location.href = 'verifikasi_lupa.html'; }, 1000);
        });
    </script>
</body>
</html>
