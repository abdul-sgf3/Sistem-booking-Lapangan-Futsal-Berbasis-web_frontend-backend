$kind: http-example
name: "12 - Login Gagal: Email Belum Diverifikasi"
request:
  url: "{{base_url}}/{{backend_path}}/auth/login.php"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "{{login_unverified_email}}",
        "password": "{{login_password}}"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Date: Thu, 19 Nov 2026 10:07:40 GMT
    Server: Apache/2.4.58 (Win64) OpenSSL/3.1.3 PHP/8.2.12
    X-Powered-By: PHP/8.2.12
    Vary: Origin
    Access-Control-Allow-Methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
    Access-Control-Allow-Headers: Content-Type, Authorization, X-Requested-With, Accept
    Access-Control-Max-Age: "86400"
    X-Content-Type-Options: nosniff
    Expires: Thu, 19 Nov 1981 08:52:00 GMT
    Cache-Control: no-store, no-cache, must-revalidate
    Pragma: no-cache
    Content-Length: "239"
    Keep-Alive: timeout=5, max=100
    Connection: Keep-Alive
    Content-Type: application/json; charset=UTF-8
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "Email belum diverifikasi. Silakan verifikasi terlebih dahulu.",
        "data": {
          "need_verify": true,
          "email": "unverif.1795082643321.48107@example.com",
          "email_sent": false,
          "redirect": "verifikasi.html",
          "otp_debug": "857430"
        }
      }
order: 1000
