<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --vsq-navy: #131B2E; 
            --vsq-blue: #477FEB; 
            --vsq-red: #FF0000; 
            --vsq-gray: #848484; 
            --vsq-error: #FF5555;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; margin: 0; padding: 0; }

        .vsq-wrapper { display: flex; min-height: 100vh; width: 100%; }

        /* Sisi Kiri (Form) */
        .vsq-left { flex: 1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 40px 30px; position: relative; }
        .vsq-back-btn { position: absolute; top: 30px; left: 30px; color: #000; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .vsq-back-btn:hover { transform: translateX(-4px); }
        .vsq-back-btn svg { width: 32px; height: 32px; stroke: #000; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .vsq-card { width: 100%; max-width: 380px; text-align: center; }
        
        /* Logo */
        .vsq-logo { margin-bottom: 20px; }
        .vsq-logo h1 { font-size: 32px; font-weight: 800; color: var(--vsq-navy); margin: 0; letter-spacing: -0.5px; }
        .vsq-logo p { font-size: 18px; font-weight: 800; color: var(--vsq-red); letter-spacing: 1px; margin-top: 2px; }
        
        /* Teks Judul */
        .vsq-title { font-size: 16px; font-weight: 700; color: #000; margin: 20px 0 8px 0; }
        .vsq-subtitle { font-size: 13px; color: #4B5563; margin-bottom: 20px; line-height: 1.5; }

        /* Ilustrasi */
        .vsq-illustration { margin-bottom: 24px; display: flex; justify-content: center; }
        .vsq-illustration img { width: 180px; height: auto; object-fit: contain; }

        /* Form Group */
        .vsq-form-group { margin-bottom: 20px; text-align: left; position: relative; }
        .vsq-form-group label { display: block; font-size: 13px; font-weight: 500; color: #000; margin-bottom: 6px; }
        .vsq-form-group label span { color: var(--vsq-red); }
        
        .vsq-form-control { width: 100%; height: 48px; padding: 10px 16px; font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; border: 1px solid var(--vsq-gray); border-radius: 10px; outline: none; transition: all 0.2s; }
        .vsq-form-control:focus { border-color: var(--vsq-blue); }
        .vsq-form-control.is-invalid { border: 1px solid var(--vsq-error) !important; }

        /* Pesan Error */
        .vsq-error-msg { display: none; align-items: flex-start; gap: 6px; font-size: 11px; color: var(--vsq-error); margin-top: 6px; font-weight: 500; }
        .vsq-error-msg.show { display: flex; }
        .vsq-error-icon { width: 12px; height: 12px; background: transparent; border: 2px solid var(--vsq-error); color: var(--vsq-error); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; flex-shrink: 0; margin-top: 1px; }

        /* Tombol */
        .vsq-btn { display: block; width: 100%; height: 48px; padding: 0 20px; font-size: 14px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; color: #FFFFFF; background-color: var(--vsq-navy); border: none; border-radius: 10px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .vsq-btn:hover { background-color: #0a0e1a; }

        /* Kanan: Gambar */
        .vsq-right { flex: 1; background: linear-gradient(rgba(19, 27, 46, 0.7), rgba(19, 27, 46, 0.7)), url('assets/uploads/lapangan/Lapangan2.jpeg') center/cover no-repeat; border-left: 1px solid #000; }

        @media (max-width: 900px) { .vsq-wrapper { flex-direction: column; } .vsq-left { padding: 80px 20px 40px; } .vsq-right { min-height: 200px; order: -1; border-left: none; border-bottom: 1px solid #000; } }
    </style>
</head>
<body>
    <div class="vsq-wrapper">
        <div class="vsq-left">
            <a href="login.html" class="vsq-back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
            
            <div class="vsq-card">
                <div class="vsq-logo">
                    <h1>Vincent'SQ</h1>
                    <p>SPORTS ARENA</p>
                </div>
                
                <div class="vsq-title">Lupa Password?</div>
                <div class="vsq-subtitle">Jangan khawatir, kami akan membantumu mereset password</div>
                
                <div class="vsq-illustration">
                    <!-- Pastikan nama file gambar kurir ini sesuai dengan yang ada di folder assets abang -->
                    <img src="assets/images/ilustrasi-kurir.png" alt="Ilustrasi Kurir" onerror="this.src='https://illustrations.popsy.co/blue/delivery.svg'">
                </div>
                
                <form id="formLupa" novalidate>
                    <div class="vsq-form-group">
                        <label for="email">Email<span>*</span></label>
                        <input type="email" id="email" class="vsq-form-control" placeholder="Masukkan email...">
                        
                        <!-- Statement Validasi -->
                        <div class="vsq-error-msg" id="err-email-kosong"><span class="vsq-error-icon">!</span> Email tidak boleh kosong</div>
                        <div class="vsq-error-msg" id="err-email-format"><span class="vsq-error-icon">!</span> Email Harus mengandung karakter @ dan .</div>
                        <div class="vsq-error-msg" id="err-email-spasi"><span class="vsq-error-icon">!</span> Email tidak boleh mengandung spasi!</div>
                        <div class="vsq-error-msg" id="err-email-notfound"><span class="vsq-error-icon">!</span> Email belum Terdaftar!</div>
                    </div>
                    <button type="submit" class="vsq-btn" id="btnLanjut">Melanjutkan</button>
                </form>
            </div>
        </div>
        <div class="vsq-right"></div>
    </div>

    <script>
        const API_BASE = window.location.hostname.includes('localhost') || window.location.hostname.includes('127.0.0.1')
            ? 'http://localhost/vincent-arena/Backend/API' 
            : 'https://sistem-booking-lapangan-futsal-berbasis-webfron-production.up.railway.app/API';

        const emailInput = document.getElementById('email');
        const formLupa = document.getElementById('formLupa');
        const btnLanjut = document.getElementById('btnLanjut');
        
        const errKosong = document.getElementById('err-email-kosong');
        const errFormat = document.getElementById('err-email-format');
        const errSpasi = document.getElementById('err-email-spasi');
        const errNotFound = document.getElementById('err-email-notfound');

        function resetErrors() {
            emailInput.classList.remove('is-invalid');
            errKosong.classList.remove('show');
            errFormat.classList.remove('show');
            errSpasi.classList.remove('show');
            errNotFound.classList.remove('show');
        }

        function validateEmailRealtime() {
            resetErrors();
            const val = emailInput.value;

            if (val === '') return false;
            
            if (val.includes(' ')) {
                emailInput.classList.add('is-invalid');
                errSpasi.classList.add('show');
                return false;
            }
            if (!val.includes('@') || !val.includes('.')) {
                emailInput.classList.add('is-invalid');
                errFormat.classList.add('show');
                return false;
            }
            return true;
        }

        // Validasi saat mengetik
        emailInput.addEventListener('input', validateEmailRealtime);

        // Validasi saat pindah kolom
        emailInput.addEventListener('blur', function() {
            if (this.value.trim() === '') {
                resetErrors();
                emailInput.classList.add('is-invalid');
                errKosong.classList.add('show');
            } else {
                validateEmailRealtime();
            }
        });

        // Proses Submit
        formLupa.addEventListener('submit', async function(e) {
            e.preventDefault();
            resetErrors();

            if (emailInput.value.trim() === '') {
                emailInput.classList.add('is-invalid');
                errKosong.classList.add('show');
                return;
            }
            if (!validateEmailRealtime()) return;

            btnLanjut.disabled = true;
            btnLanjut.textContent = 'Memverifikasi...';

            try {
                // Karena API lupa password mungkin belum ada, kita bisa gunakan check email
                // Atau simulasikan sukses jika API belum siap.
                // Di sini saya simulasikan sukses jika email valid.
                
                // Simpan email sementara untuk halaman selanjutnya
                localStorage.setItem('reset_email', emailInput.value);
                
                // Simulasi delay loading
                setTimeout(() => {
                    window.location.href = 'verifikasi_lupa.html';
                }, 1000);

            } catch (error) {
                emailInput.classList.add('is-invalid');
                errNotFound.classList.add('show');
                btnLanjut.disabled = false;
                btnLanjut.textContent = 'Melanjutkan';
            }
        });
    </script>
</body>
</html>
