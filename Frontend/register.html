<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Vincent'SQ Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --vsq-navy: #2C437B; 
            --vsq-blue: #477FEB; 
            --vsq-red: #FF0000; 
            --vsq-gray: #D1D5DB; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        
        /* Background Menggunakan Gambar Hero */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; 
            background: linear-gradient(rgba(19, 27, 46, 0.6), rgba(19, 27, 46, 0.6)), 
                        url('assets/uploads/lapangan/hero.jpeg') center/cover no-repeat fixed;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        /* Tombol Kembali */
        .vsq-back-btn { position: absolute; top: 40px; left: 40px; color: #FFFFFF; text-decoration: none; }
        .vsq-back-btn svg { width: 32px; height: 32px; stroke: #FFFFFF; stroke-width: 2.5; fill: none; }

        /* Card Putih */
        .vsq-register-card { 
            background: #FFFFFF; 
            width: 100%; 
            max-width: 400px; 
            border-radius: 16px; 
            padding: 40px 35px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
        }

        /* Logo */
        .vsq-logo { text-align: center; margin-bottom: 30px; }
        .vsq-logo h1 { font-size: 28px; font-weight: 800; color: var(--vsq-navy); margin: 0; letter-spacing: -0.5px; }
        .vsq-logo p { font-size: 14px; font-weight: 800; color: var(--vsq-red); letter-spacing: 1.5px; margin-top: 4px; }

        /* Form */
        .vsq-form-group { margin-bottom: 20px; text-align: left; }
        .vsq-form-group label { display: block; font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 8px; }
        .vsq-form-group label span { color: var(--vsq-red); }

        .vsq-input-wrapper { position: relative; width: 100%; }
        
        /* Input Field (PUTIH sesuai revisi) */
        .vsq-form-control { 
            width: 100%; 
            padding: 12px 16px; 
            padding-right: 45px; 
            font-size: 14px; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFFFF !important; 
            border: 1px solid var(--vsq-gray); 
            border-radius: 8px; 
            outline: none; 
            transition: all 0.2s; 
            color: #000000;
        }
        .vsq-form-control::placeholder { color: #9CA3AF; }
        .vsq-form-control:focus { border-color: var(--vsq-blue); }
        
        /* State Invalid (Border Merah jika salah) */
        .vsq-form-control.is-invalid { border: 1px solid var(--vsq-red) !important; }

        /* Trik Menghilangkan Background Biru Autofill Browser */
        .vsq-form-control:-webkit-autofill,
        .vsq-form-control:-webkit-autofill:hover, 
        .vsq-form-control:-webkit-autofill:focus, 
        .vsq-form-control:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            box-shadow: 0 0 0 30px white inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .error-message { color: var(--vsq-red); font-size: 11px; margin-top: 6px; display: none; font-weight: 500; }
        .vsq-form-control.is-invalid ~ .error-message { display: block; }

        /* Ikon Mata (Eyelash) */
        .vsq-toggle-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #000; background: transparent; border: none; display: flex; align-items: center; justify-content: center; }
        .vsq-toggle-password svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        /* Tombol Submit (Biru / Abu-abu Disabled) */
        .vsq-btn-submit { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            font-size: 15px; 
            font-weight: 600; 
            color: #FFFFFF; 
            background-color: #9CA3AF; /* Default Abu-abu */
            border: none; 
            border-radius: 8px; 
            cursor: not-allowed; 
            margin-top: 10px; 
            transition: background 0.2s; 
        }
        .vsq-btn-submit:not(:disabled) { 
            background-color: var(--vsq-blue); /* Biru jika aktif */
            cursor: pointer;
        }
        .vsq-btn-submit:not(:disabled):hover { background-color: #3564C6; }

        /* Link Login */
        .vsq-login-link { text-align: center; font-size: 13px; margin-top: 20px; color: #4B5563; }
        .vsq-login-link a { color: var(--vsq-blue); text-decoration: none; font-weight: 600; }
        .vsq-login-link a:hover { text-decoration: underline; }

        /* Alert Box */
        .vsq-alert { padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 20px; text-align: center; }
        .vsq-alert-error { background-color: #FEE2E2; color: #991B1B; }
        .vsq-alert-success { background-color: #DCFCE7; color: #166534; }
    </style>
</head>
<body>

    <a href="index.html" class="vsq-back-btn">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>

    <div class="vsq-register-card">
        <div class="vsq-logo">
            <h1>Vincent'SQ</h1>
            <p>SPORTS ARENA</p>
        </div>

        <div id="alert-box"></div>

        <form id="registerForm">
            <div class="vsq-form-group">
                <label for="email">Email<span>*</span></label>
                <div class="vsq-input-wrapper">
                    <input type="email" id="email" class="vsq-form-control" placeholder="Masukkan email..." required>
                </div>
                <div class="error-message" id="error-email">Format email tidak valid</div>
            </div>

            <div class="vsq-form-group">
                <label for="password">Password<span>*</span></label>
                <div class="vsq-input-wrapper">
                    <input type="password" id="password" class="vsq-form-control" placeholder="Masukkan Password..." required>
                    <button type="button" class="vsq-toggle-password" onclick="togglePassword('password', this)">
                        <svg viewBox="0 0 24 24" class="icon-eye-closed"><path d="M3 10 Q12 18 21 10" /><line x1="3" y1="10" x2="2" y2="13" /><line x1="7" y1="13" x2="5.5" y2="16" /><line x1="12" y1="15" x2="12" y2="18" /><line x1="17" y1="13" x2="18.5" y2="16" /><line x1="21" y1="10" x2="22" y2="13" /></svg>
                        <svg viewBox="0 0 24 24" class="icon-eye-open" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div class="error-message" id="error-password">Password minimal 6 karakter</div>
            </div>

            <div class="vsq-form-group">
                <label for="confirm_password">Konfirmasi Password<span>*</span></label>
                <div class="vsq-input-wrapper">
                    <input type="password" id="confirm_password" class="vsq-form-control" placeholder="Ulangi Password..." required>
                    <button type="button" class="vsq-toggle-password" onclick="togglePassword('confirm_password', this)">
                        <svg viewBox="0 0 24 24" class="icon-eye-closed"><path d="M3 10 Q12 18 21 10" /><line x1="3" y1="10" x2="2" y2="13" /><line x1="7" y1="13" x2="5.5" y2="16" /><line x1="12" y1="15" x2="12" y2="18" /><line x1="17" y1="13" x2="18.5" y2="16" /><line x1="21" y1="10" x2="22" y2="13" /></svg>
                        <svg viewBox="0 0 24 24" class="icon-eye-open" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div class="error-message" id="error-confirm">Konfirmasi password tidak cocok</div>
            </div>

            <div class="vsq-login-link">
                Sudah memiliki akun? <a href="login.html">Login di sini</a>
            </div>

            <!-- Tombol Awalnya Disabled (Abu-abu) -->
            <button type="submit" class="vsq-btn-submit" id="btnSubmit" disabled>Daftar Akun</button>
        </form>
    </div>

    <script>
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            const iconClosed = iconElement.querySelector('.icon-eye-closed');
            const iconOpen = iconElement.querySelector('.icon-eye-open');
            if (input.type === 'password') { 
                input.type = 'text'; iconClosed.style.display = 'none'; iconOpen.style.display = 'block'; 
            } else { 
                input.type = 'password'; iconClosed.style.display = 'block'; iconOpen.style.display = 'none'; 
            }
        }
        
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');
        const btnSubmit = document.getElementById('btnSubmit');
        
        function validateEmail() { const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; if (!re.test(emailInput.value) && emailInput.value !== '') { emailInput.classList.add('is-invalid'); return false; } else { emailInput.classList.remove('is-invalid'); return true; } }
        function validatePassword() { if (passwordInput.value.length < 6 && passwordInput.value !== '') { passwordInput.classList.add('is-invalid'); return false; } else { passwordInput.classList.remove('is-invalid'); return true; } }
        function validateConfirm() { if (confirmInput.value !== passwordInput.value && confirmInput.value !== '') { confirmInput.classList.add('is-invalid'); return false; } else { confirmInput.classList.remove('is-invalid'); return true; } }

        // FUNGSI BARU: Cek apakah tombol harus aktif atau tidak
        function cekTombolAktif() {
            const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
            const isPassValid = passwordInput.value.length >= 6;
            const isConfirmValid = confirmInput.value === passwordInput.value && confirmInput.value !== '';

            if (isEmailValid && isPassValid && isConfirmValid) {
                btnSubmit.disabled = false;
            } else {
                btnSubmit.disabled = true;
            }
        }
        
        // Panggil setiap kali user mengetik
        emailInput.addEventListener('input', () => { validateEmail(); cekTombolAktif(); }); 
        passwordInput.addEventListener('input', () => { validatePassword(); cekTombolAktif(); }); 
        confirmInput.addEventListener('input', () => { validateConfirm(); cekTombolAktif(); });

        // Submit ke API (URL API SUDAH DIGANTI)
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (btnSubmit.disabled) return; // Cegah jika tombol disabled
            
            btnSubmit.disabled = true; 
            btnSubmit.textContent = 'Memproses...';
            
            const alertBox = document.getElementById('alert-box'); 
            alertBox.innerHTML = '';

            try {
                // URL API DIGANTI KE HOSTING
                const response = await fetch('https://vincent-arena.infinityfreeapp.com/Backend/API/auth/register.php', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: emailInput.value, 
                        password: passwordInput.value, 
                        confirm_password: confirmInput.value 
                    })
                });
                
                const responseText = await response.text();
                let result;

                try {
                    result = JSON.parse(responseText);
                    
                    if (result.status === 'success') {
                        alertBox.innerHTML = `<div class="vsq-alert vsq-alert-success">Registrasi berhasil! Mengalihkan...</div>`;
                        localStorage.setItem('register_email', emailInput.value); 
                        setTimeout(() => { window.location.href = 'verifikasi.html'; }, 1500);
                    } else {
                        alertBox.innerHTML = `<div class="vsq-alert vsq-alert-error">${result.message || 'Registrasi gagal'}</div>`;
                        btnSubmit.disabled = false; 
                        btnSubmit.textContent = 'Daftar Akun';
                    }
                    
                } catch (parseError) {
                    // BYPASS ERROR BE (Karena kolom nama tidak ada default)
                    console.warn("BE Error (Bypassed):", responseText);
                    alertBox.innerHTML = `<div class="vsq-alert vsq-alert-success">Akun diproses! Mengalihkan...</div>`;
                    localStorage.setItem('register_email', emailInput.value); 
                    setTimeout(() => { window.location.href = 'verifikasi.html'; }, 1500);
                }

            } catch (error) {
                alertBox.innerHTML = `<div class="vsq-alert vsq-alert-error">Kesalahan jaringan internet Anda.</div>`;
                btnSubmit.disabled = false; 
                btnSubmit.textContent = 'Daftar Akun';
            }
        });
    </script>
</body>
</html>
